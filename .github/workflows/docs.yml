name: API docs

# Renders the C++ API with Doxygen (issue #12, PLAN item 15).
#
# Building the docs is a check in its own right, not just a publishing step: the
# render runs with warnings promoted to errors, so a malformed reference or a
# comment that confuses the parser fails here rather than quietly producing a
# worse page.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Supersede in-flight runs on the same ref -- see the note in cpp-tests.yml.
#
# Cancellation is scoped to pull requests here, unlike the other two workflows,
# because this one has a `deploy` job: a master run may be publishing, and half a
# publish is worse than a redundant one. PR iterations have nothing to leave in a
# broken state, so those still supersede.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The mirror fix is a local composite action; its `action.yml` records why
      # this is needed and what was measured. It must precede every apt call.
      - uses: ./.github/actions/working-apt-mirror

      - name: Install Doxygen and graphviz
        timeout-minutes: 5
        run: |
          set -eu
          apt_opts="-o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 -o Acquire::Retries=2"
          sudo apt-get $apt_opts update
          sudo apt-get $apt_opts install -y doxygen graphviz

      # The renderer reads the headers through tools/doxygen_filter.awk, which
      # rewrites comments so Doxygen can see them. A bug there could silently
      # alter what Doxygen believes the CODE says, and the rendered signatures
      # would be wrong with nothing to indicate it. So: assert that every line
      # which is not a whole-line comment survives the filter byte-for-byte.
      - name: Check the filter alters only comments
        run: |
          set -eu
          status=0
          for f in $(find inst/include -name '*.hpp' | sort); do
            awk '!/^[ \t]*\/\//' "$f" > /tmp/orig.txt
            awk -f tools/doxygen_filter.awk "$f" \
              | awk '/^[ \t]*\/\*! \\file/ {inf=1; next}
                     inf                   {if ($0 ~ /^[ \t]*\*\/[ \t]*$/) inf=0; next}
                     /^[ \t]*\/\//         {next}
                     {print}' > /tmp/filtered.txt
            if ! diff -u /tmp/orig.txt /tmp/filtered.txt > /tmp/delta.txt; then
              echo "::error file=$f::doxygen_filter.awk changed non-comment lines"
              head -40 /tmp/delta.txt
              status=1
            fi
          done
          exit $status

      # ⚠️ Doxygen 1.9 -- the version this runner installs -- handles the FIRST
      # `\verbatim` in a comment block and drops the second one's OPEN, then
      # reports `unexpected command endverbatim` at its close. The line it names
      # is in the FILTERED stream and lands in unrelated code: in the case that
      # found this, 120 lines past the comment responsible. Doxygen 1.17 renders
      # the same input in silence, so a local run says nothing and the only
      # oracle is this job. Assert the shape here, where the message can name the
      # block, rather than leaving the next person to bisect the render.
      #
      # ⚠️ It is the `///` blocks that break, NOT the `/*! \file */` one, and the
      # difference is load-bearing rather than untested: closed_form.hpp's file
      # block has carried two runs since long before this check, on a green
      # master. Counting it too fails the build on code Doxygen renders happily.
      - name: Check no comment block opens two verbatim runs
        run: |
          set -eu
          status=0
          for f in $(find inst/include -name '*.hpp' | sort); do
            awk -f tools/doxygen_filter.awk "$f" \
              | awk -v f="$f" '
                  function note(t) {
                    if (first == "") {
                      sub(/^[ \t]*(\/\/\/|\*)?[ \t]*/, "", t)
                      first = substr(t, 1, 60)
                    }
                  }
                  function flush() {
                    if (opens > 1) {
                      printf "::error file=%s::comment block [%s] opens %d verbatim runs; Doxygen 1.9 drops all but the first. One indented display per block -- see tools/doxygen_filter.awk\n", f, first, opens
                      bad = 1
                    }
                    opens = 0; first = ""
                  }
                  /^[ \t]*\/\*![ \t]*\\file/ { infile = 1; flush(); next }
                  infile {
                    if ($0 ~ /^[ \t]*\*\/[ \t]*$/) infile = 0
                    next
                  }
                  /^[ \t]*\/\// {
                    if ($0 ~ /\\verbatim[ \t]*$/) opens++
                    note($0); next
                  }
                  { flush() }
                  END { flush(); exit (bad ? 1 : 0) }' || status=1
          done
          exit $status

      # Overriding on stdin is Doxygen's documented way to change one setting
      # without a second Doxyfile. Warnings stay non-fatal for a local `doxygen`
      # run, where they are informative rather than blocking.
      - name: Render
        run: |
          { cat Doxyfile; echo "WARN_AS_ERROR = FAIL_ON_WARNINGS"; } | doxygen -

      - uses: actions/upload-artifact@v4
        with:
          name: api-docs
          path: docs/html
          if-no-files-found: error

      - name: Package for Pages
        if: github.event_name == 'push' && vars.PUBLISH_DOCS == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/html

  # Publishing is opt-in and off by default. To turn it on: set the repository
  # variable PUBLISH_DOCS to "true", and set Settings -> Pages -> Source to
  # "GitHub Actions". Until then the rendered site is still available from every
  # run as the `api-docs` artifact, and nothing here goes near the public web.
  deploy:
    needs: build
    if: github.event_name == 'push' && vars.PUBLISH_DOCS == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
