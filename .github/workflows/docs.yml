name: API docs

# Renders the package's two sites and publishes them as ONE: the pkgdown site
# (the R reference and the vignettes, issue #151) at the root, and the C++ API
# from Doxygen (issue #12) under cpp/, which _pkgdown.yml's navbar links to. A
# repository has one GitHub Pages site, so the two cannot deploy separately --
# whichever published second would replace the other. Hence one deploy job that
# needs both builds, rather than odelia's pkgdown workflow pushing to gh-pages.
#
# Building the docs is a check in its own right, not just a publishing step: the
# Doxygen render runs with warnings promoted to errors, so a malformed reference
# or a comment that confuses the parser fails here rather than quietly producing
# a worse page, and the pkgdown build fails on a topic missing from
# _pkgdown.yml's reference index or a vignette that does not knit.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Supersede in-flight runs on the same ref -- see the note in cpp-tests.yml.
#
# Cancellation is scoped to pull requests here, unlike the other two workflows,
# because this one has a `deploy` job: a master run may be publishing, and half a
# publish is worse than a redundant one. PR iterations have nothing to leave in a
# broken state, so those still supersede.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The mirror fix is a local composite action; its `action.yml` records why
      # this is needed and what was measured. It must precede every apt call.
      - uses: ./.github/actions/working-apt-mirror

      - name: Install Doxygen and graphviz
        timeout-minutes: 5
        run: |
          set -eu
          apt_opts="-o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 -o Acquire::Retries=2"
          sudo apt-get $apt_opts update
          sudo apt-get $apt_opts install -y doxygen graphviz

      # The renderer reads the headers through tools/doxygen_filter.awk, which
      # rewrites comments so Doxygen can see them. A bug there could silently
      # alter what Doxygen believes the CODE says, and the rendered signatures
      # would be wrong with nothing to indicate it. So: assert that every line
      # which is not a whole-line comment survives the filter byte-for-byte.
      - name: Check the filter alters only comments
        run: |
          set -eu
          status=0
          for f in $(find inst/include -name '*.hpp' | sort); do
            awk '!/^[ \t]*\/\//' "$f" > /tmp/orig.txt
            awk -f tools/doxygen_filter.awk "$f" \
              | awk '/^[ \t]*\/\*! \\file/ {inf=1; next}
                     inf                   {if ($0 ~ /^[ \t]*\*\/[ \t]*$/) inf=0; next}
                     /^[ \t]*\/\//         {next}
                     {print}' > /tmp/filtered.txt
            if ! diff -u /tmp/orig.txt /tmp/filtered.txt > /tmp/delta.txt; then
              echo "::error file=$f::doxygen_filter.awk changed non-comment lines"
              head -40 /tmp/delta.txt
              status=1
            fi
          done
          exit $status

      # ⚠️ Doxygen 1.9 -- the version this runner installs -- handles the FIRST
      # `\verbatim` in a comment block and drops the second one's OPEN, then
      # reports `unexpected command endverbatim` at its close. The line it names
      # is in the FILTERED stream and lands in unrelated code: in the case that
      # found this, 120 lines past the comment responsible. Doxygen 1.17 renders
      # the same input in silence, so a local run says nothing and the only
      # oracle is this job. Assert the shape here, where the message can name the
      # block, rather than leaving the next person to bisect the render.
      #
      # ⚠️ It is the `///` blocks that break, NOT the `/*! \file */` one, and the
      # difference is load-bearing rather than untested: closed_form.hpp's file
      # block has carried two runs since long before this check, on a green
      # master. Counting it too fails the build on code Doxygen renders happily.
      - name: Check no comment block opens two verbatim runs
        run: |
          set -eu
          status=0
          for f in $(find inst/include -name '*.hpp' | sort); do
            awk -f tools/doxygen_filter.awk "$f" \
              | awk -v f="$f" '
                  function note(t) {
                    if (first == "") {
                      sub(/^[ \t]*(\/\/\/|\*)?[ \t]*/, "", t)
                      first = substr(t, 1, 60)
                    }
                  }
                  function flush() {
                    if (opens > 1) {
                      printf "::error file=%s::comment block [%s] opens %d verbatim runs; Doxygen 1.9 drops all but the first. One indented display per block -- see tools/doxygen_filter.awk\n", f, first, opens
                      bad = 1
                    }
                    opens = 0; first = ""
                  }
                  /^[ \t]*\/\*![ \t]*\\file/ { infile = 1; flush(); next }
                  infile {
                    if ($0 ~ /^[ \t]*\*\/[ \t]*$/) infile = 0
                    next
                  }
                  /^[ \t]*\/\// {
                    if ($0 ~ /\\verbatim[ \t]*$/) opens++
                    note($0); next
                  }
                  { flush() }
                  END { flush(); exit (bad ? 1 : 0) }' || status=1
          done
          exit $status

      # Overriding on stdin is Doxygen's documented way to change one setting
      # without a second Doxyfile. Warnings stay non-fatal for a local `doxygen`
      # run, where they are informative rather than blocking.
      - name: Render
        run: |
          { cat Doxyfile; echo "WARN_AS_ERROR = FAIL_ON_WARNINGS"; } | doxygen -

      # The model registry (inst/model-registry.yml) names C++ symbols and never
      # a line. This resolves every one of them in the XML just rendered, maps
      # the filtered line numbers back to the source, checks what each equation
      # reads against what its function references and that every literal is
      # written in its function, and writes the resolved
      # registry into the site so a document can link to the API without a
      # Doxygen run of its own. R is installed for that alone: the two packages
      # are RSPM binaries and nothing is compiled.
      #
      # ⚠️ setup-r, not setup-r-dependencies: the latter reads DESCRIPTION and
      # would pull Rcpp, BH and odelia into a job that builds nothing.
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Resolve the model registry against the XML
        run: |
          Rscript -e 'install.packages(c("yaml", "xml2"))'
          Rscript tools/registry_symbols.R docs/xml docs/html/model-registry.yml

      - uses: actions/upload-artifact@v4
        with:
          name: api-docs
          path: docs/html
          if-no-files-found: error

  # The R reference and the vignettes. Steps follow r-lib's pkgdown example, as
  # odelia's workflow does; only the publishing differs (see the top of the file).
  pkgdown:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      # BEFORE setup-r, for the reason given in R-CMD-check.yml.
      - uses: ./.github/actions/working-apt-mirror

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # odelia is not on CRAN and DESCRIPTION names no Remotes, so it is fetched
      # here at the release R-CMD-check.yml checks against. Keep the two in step.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::pkgdown
            github::traitecoevo/odelia@v0.10.0
            local::.
          needs: website

      # dest_dir is explicit because this function overrides _pkgdown.yml's
      # `destination` with its own default of docs/, where Doxygen writes.
      - name: Build site
        run: pkgdown::build_site_github_pages(dest_dir = "docs/site", new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - uses: actions/upload-artifact@v4
        with:
          name: pkgdown-site
          path: docs/site
          if-no-files-found: error
          include-hidden-files: true

  # Publishing is opt-in and off by default. To turn it on: set the repository
  # variable PUBLISH_DOCS to "true", and set Settings -> Pages -> Source to
  # "GitHub Actions". Until then each rendered site is available from every run as
  # the `pkgdown-site` and `api-docs` artifacts, and nothing here goes near the
  # public web.
  deploy:
    needs: [build, pkgdown]
    if: github.event_name == 'push' && vars.PUBLISH_DOCS == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pkgdown-site
          path: site

      - uses: actions/download-artifact@v4
        with:
          name: api-docs
          path: site/cpp

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
