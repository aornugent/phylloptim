name: C++ tests

# The test suite needs no R, so this is fast and can run on every push. It also
# catches the portability problems that have bitten this code before -- long double
# width and FMA contraction differing between compilers and architectures (see the
# arm64 note in Leaf::hydraulic_cost_Sperry), which a single-platform build misses.
#
# ⚠️ THIS WORKFLOW IS ALSO THE ENFORCEMENT MECHANISM FOR PLAN ITEM 6a, and must
# not gain an R step. The package has an R layer now, and what keeps
# inst/include/ usable from C++ and Python is that these jobs build the whole
# model on runners with no R installed. An `R CMD check` job compiles the same
# headers with R present and cannot tell the difference, so it is a complement,
# never a replacement. Put R work in a separate workflow.

on:
  push:
    # This repo's default branch is master, not main. It was [main] until
    # 2026-08-03, which meant no push ever triggered a run and the workflow sat
    # unexercised from the day it was added until the first pull request.
    branches: [master]
  pull_request:
  workflow_dispatch:

# Supersede in-flight runs on the same ref. Without this, every intermediate push
# to a PR branch ran its whole matrix to completion alongside its successor --
# 202 jobs fired on 2026-08-04 alone, which is how this repo consumed the org's
# entire 2000-minute monthly Actions allowance in three days while it was still
# private. It is public now, so those minutes are free, but the redundant runs
# still queue behind each other (free-tier accounts cap concurrent macOS jobs at
# 5) and delay the result that matters.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, cxx: g++ }
          - { os: ubuntu-latest, cxx: clang++ }
          - { os: macos-latest, cxx: clang++ }

    name: ${{ matrix.os }} / ${{ matrix.cxx }}

    steps:
      - uses: actions/checkout@v4

      # odelia supplies the spline interpolator and the vendored XAD headers. Both
      # are header-only, so a shallow checkout of the sibling repo is enough --
      # nothing needs installing or building.
      - name: Check out odelia (header-only dependency)
        uses: actions/checkout@v4
        with:
          repository: traitecoevo/odelia
          path: odelia
          fetch-depth: 1

      - name: Install Boost headers (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libboost-dev

      - name: Install Boost headers (macOS)
        if: runner.os == 'macOS'
        run: brew install boost

      - name: Resolve Boost include path
        id: boost
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            echo "inc=$(brew --prefix boost)/include" >> "$GITHUB_OUTPUT"
          else
            echo "inc=/usr/include" >> "$GITHUB_OUTPUT"
          fi

      # The golden file is compared bit-exactly on the platform that generated it
      # (macOS/arm64) and with per-field tolerances everywhere else. This is not a
      # loosening: libm's exp/pow are not bit-reproducible between glibc on
      # x86-64 and Apple's libm on arm64, so bit-exactness across platforms was
      # never achievable. Measured, the fields split into two classes -- profit
      # (the maximum) at 1.85e-6, and everything derived from the argmax at
      # 5.53e-4, because the profit maximum is flat and displacing it goes as
      # sqrt. See the comment above main() in tests/cpp/test_golden.cpp.
      - name: Resolve golden comparison mode
        id: golden
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            echo "args=" >> "$GITHUB_OUTPUT"
          else
            echo "args=--cross-platform" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and run
        env:
          CXX: ${{ matrix.cxx }}
        run: |
          make -C tests/cpp \
            CXX="$CXX" \
            ODELIA_INC="$GITHUB_WORKSPACE/odelia/inst/include" \
            BH_INC="${{ steps.boost.outputs.inc }}" \
            GOLDEN_ARGS="${{ steps.golden.outputs.args }}"

      # Compile the benchmarks but do not run them. They are timing harnesses, so
      # they would be flaky gates on a shared runner; building them keeps them
      # from rotting when the headers change.
      #
      # ⚠️ Name every harness here. This step used to say `bench_solve`, which is
      # a target and not the `bench` group -- so adding bench_gradient.cpp without
      # touching this file would have left it uncompiled by CI, which is how #25
      # first went red with a green local run.
      - name: Build the benchmarks (compile only)
        env:
          CXX: ${{ matrix.cxx }}
        run: |
          make -C tests/cpp bench_solve bench_gradient \
            CXX="$CXX" \
            ODELIA_INC="$GITHUB_WORKSPACE/odelia/inst/include" \
            BH_INC="${{ steps.boost.outputs.inc }}"

      # The same headers through CMake, which is the route a C++ or Python
      # consumer takes (README: "Use from C++", "Use from Python"). Cheap, and it
      # covers three things the Makefile cannot: that the install rules ship the
      # right headers and exclude the Rcpp-dependent ones, that find_package
      # produces a usable target, and that the whole thing works on a runner
      # where R has never been installed.
      - name: Build, test and install through CMake (no R)
        env:
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -B build-cmake \
            -DCMAKE_CXX_COMPILER="$CXX" \
            -DPHYLLOPTIM_ODELIA_INCLUDE_DIR="$GITHUB_WORKSPACE/odelia/inst/include" \
            -DPHYLLOPTIM_BOOST_INCLUDE_DIR="${{ steps.boost.outputs.inc }}"
          cmake --build build-cmake -j 3
          ctest --test-dir build-cmake --output-on-failure
          cmake --install build-cmake --prefix "$GITHUB_WORKSPACE/cmake-prefix"

      # An installed phylloptim must be consumable by find_package, and must NOT have
      # shipped phylloptim.h or the RcppR6_*.hpp headers -- those need Rcpp, and handing
      # them to a non-R consumer would turn PLAN item 6a's one-way dependency into
      # a broken build a long way from its cause.
      - name: Consume the installed package (no R)
        env:
          CXX: ${{ matrix.cxx }}
        run: |
          for f in phylloptim.h phylloptim/RcppR6_pre.hpp phylloptim/RcppR6_post.hpp phylloptim/RcppR6_support.hpp; do
            if [ -e "$GITHUB_WORKSPACE/cmake-prefix/include/$f" ]; then
              echo "$f was installed; it needs Rcpp and must be excluded" >&2
              exit 1
            fi
          done
          mkdir -p consumer && cd consumer
          cat > CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.16)
          project(consumer LANGUAGES CXX)
          find_package(phylloptim REQUIRED)
          add_executable(consumer main.cpp)
          target_link_libraries(consumer PRIVATE phylloptim::phylloptim)
          EOF
          cat > main.cpp <<'EOF'
          #include <phylloptim.hpp>
          #include <cmath>
          #include <cstdio>
          #include <vector>
          int main() {
            phylloptim::Leaf l;
            // The root RESISTANCES, via the architecture model (#33). Exercising
            // root_network_from_carbon and layer_thickness here is deliberate: a
            // consumer with a carbon profile has to be able to reach both from the
            // installed headers, so this checks they were shipped and not only that
            // the solve was.
            const std::vector<double> soil_depth{1.0};
            const phylloptim::RootNetwork roots = phylloptim::root_network_from_carbon(
                {1.0 / 0.05}, phylloptim::layer_thickness(soil_depth), 3.4e2, 9.4e3);
            l.set_physiology(roots, 900, {2.0}, soil_depth, 1.0 * 0.000157 / 5.0,
                             2.0, 40.0, 25.0, 21.0, 101.3);
            l.find_root_collar_psi();
            std::printf("profit = %.17g\n", l.profit_);
            // And the batched trait gradient (#4 stage 2), which is public surface
            // for plant. It is reached from the same umbrella header, so this
            // checks gradient.hpp was shipped AND that it needs no R -- the R
            // layer is the only caller inside this package, so nothing else here
            // would notice if it grew a dependency on Rcpp.
            phylloptim::gradient::Drivers d;
            d.root_network = roots;
            d.PPFD = 900; d.psi_soil = {2.0}; d.soil_depth = soil_depth;
            d.atm_vpd = 2.0; d.ca = 40.0; d.leaf_temp = 25.0;
            d.atm_o2_kpa = 21.0; d.atm_kpa = 101.3;
            // ⚠️ ALL n_pars ELEMENTS, WRITTEN OUT: a short initialiser compiles
            // and zero-fills the rest, so adding a parameter would silently pass
            // 0.0 for it here. The traits in set_traits' order, then the two
            // non-traits.
            double theta[phylloptim::gradient::n_pars] = {
                96.0, 2.680147, 3.898245, 5.870283, 2.680147, 3.898245,
                5.870283, 1.5, 157.44, 0.30, 0.7, 0.99, 7.5, 1.44,
                1.0 * 0.000157 / 5.0, 0.0};
            const int pars[1] = {0};  // vcmax_25
            const std::vector<phylloptim::gradient::Drivers> obs{d, d};
            const std::vector<phylloptim::gradient::Result> g =
                phylloptim::gradient::batch(l, theta, 1, obs, false, pars, 1,
                                            phylloptim::gradient::Settings());
            std::printf("dA/dvcmax = %.17g  status = %s\n", g[0].grad[0],
                        phylloptim::gradient::status_name(g[0].status).c_str());
            // Both observations are the same point, so a per-row loop that leaked
            // state between rows shows up here rather than nowhere.
            if (g.size() != 2 || g[0].grad[0] != g[1].grad[0] ||
                g[0].status != phylloptim::gradient::Status::Interior) {
              return 1;
            }
            // The R layer's arbitrated reference for this operating point, loosely
            // compared for the same reason profit is below.
            if (std::fabs(g[0].grad[0] - 0.0209349) > 1e-5) {
              return 1;
            }
            l.set_physiology(roots, 900, {2.0}, soil_depth,
                             1.0 * 0.000157 / 5.0, 2.0, 40.0, 25.0, 21.0, 101.3);
            l.find_root_collar_psi();
            // The golden file's profit at this operating point -- the
            // psi_soil=2, ppfd=900, vpd=2, layers=1 row of
            // tests/cpp/golden/operating_points.tsv. Compared loosely on purpose:
            // the point here is that an installed package computes the model, not
            // that this runner reproduces macOS/arm64 bit-for-bit -- test_golden
            // above already makes the exact claim, with the right per-platform
            // tolerances. (The value here read 2.5158434693939866 until #33, which
            // is 2.2e-08 off the golden row and inside the tolerance, so it never
            // failed; corrected so it cannot be mistaken for the golden value.)
            return std::fabs(l.profit_ - 2.5158434915102319) < 1e-6 ? 0 : 1;
          }
          EOF
          cmake -B build \
            -DCMAKE_CXX_COMPILER="$CXX" \
            -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/cmake-prefix" \
            -DPHYLLOPTIM_ODELIA_INCLUDE_DIR="$GITHUB_WORKSPACE/odelia/inst/include" \
            -DPHYLLOPTIM_BOOST_INCLUDE_DIR="${{ steps.boost.outputs.inc }}"
          cmake --build build
          ./build/consumer

      - name: Note on failure
        if: failure()
        run: |
          echo "If only the golden test failed, read the worst-relative-difference"
          echo "line it printed before doing anything else."
          echo
          echo "  ~1e-15  reassociation / cross-platform libm. Not a regression."
          echo "  ~1e-4   a real change in behaviour."
          echo
          echo "Linux already compares with --cross-platform, so a failure here is"
          echo "either genuinely large or an amplified solver decision (these"
          echo "nested solvers amplify up to about GSS_tol_abs, 1e-3)."
          echo
          echo "Do NOT regenerate the golden file to make this pass. It is"
          echo "generated on macOS/arm64; regenerating elsewhere just moves the"
          echo "failure to the other platform. See tests/cpp/test_golden.cpp."
