  # --- vulnerability and supply --------------------------------------------------
  # --- vulnerability -----------------------------------------------------------
  stem_P50:
    section: vulnerability
    symbol: 'P_{50}'
    units: 'MPa'
    class: trait
    meaning: 'stem potential at 50% loss of conductivity, a positive magnitude; one of the stem curve''s two settable numbers (hazard 1), moved only through set_traits()'
    source: 'E. saligna default (leaf_traits())'
    placeholder: false
    code: phylloptim::Leaf::stem_P50
  stem_c:
    section: vulnerability
    symbol: 'c'
    units: '–'
    class: trait
    meaning: 'shape (steepness) of the stem Weibull curve; the other settable number'
    source: 'E. saligna default (leaf_traits())'
    placeholder: false
    code: phylloptim::Leaf::stem_c
  stem_b:
    section: vulnerability
    symbol: 'b'
    units: 'MPa'
    class: trait
    meaning: 'stem Weibull scale, the 63% loss point; DERIVED from $(P_{50}, c)$ and read-only, never settable (hazard 1)'
    source: derived (weibull_scale)
    placeholder: false
    code: phylloptim::Leaf::stem_b
  psi_crit:
    section: vulnerability
    symbol: '\psi_\mathrm{crit}'
    units: 'MPa'
    class: trait
    meaning: 'the stem curve''s P95, where $f = f_\mathrm{crit}$; DERIVED and read-only. A labelled point on a curve that continues past it (#183): the dry end only of SOX, JW26, CF77 and LeastCost, whose own forms end there, and Sperry''s reference potential'
    source: derived (critical_potential)
    placeholder: false
    code: phylloptim::Leaf::psi_crit
  root_P50:
    section: vulnerability
    symbol: 'P_{50,r}'
    units: 'MPa'
    class: trait
    meaning: 'root potential at 50% loss of conductivity; NOT the stem''s (hazard 1)'
    source: 'E. saligna default (leaf_traits()), equal to the stem''s'
    placeholder: false
    code: phylloptim::MultiLayerRoots::root_P50
    field: root_P50
  root_c:
    section: vulnerability
    symbol: 'c_r'
    units: '–'
    class: trait
    meaning: 'shape of the root Weibull curve'
    source: 'E. saligna default (leaf_traits()), equal to the stem''s'
    placeholder: false
    code: phylloptim::MultiLayerRoots::root_c
    field: root_c
  root_b:
    section: vulnerability
    symbol: 'b_r'
    units: 'MPa'
    class: trait
    meaning: 'root Weibull scale; DERIVED from $(P_{50,r}, c_r)$, read-only'
    source: derived (weibull_scale)
    placeholder: false
    code: phylloptim::MultiLayerRoots::root_b
    field: root_b
  root_psi_crit:
    section: vulnerability
    symbol: '\psi_{\mathrm{crit},r}'
    units: 'MPa'
    class: trait
    meaning: 'the root curve''s P95; DERIVED, read-only. A labelled point: it bounds nothing (#183)'
    source: derived (critical_potential)
    placeholder: false
    code: phylloptim::MultiLayerRoots::root_psi_crit
    field: root_psi_crit
  k_crit_fraction:
    section: vulnerability
    symbol: 'f_\mathrm{crit}'
    units: '–'
    class: constant
    meaning: 'fraction of maximum conductivity left at the critical potential (0.05 gives P95); also Sperry''s $k_\mathrm{crit} = f_\mathrm{crit} k_{max}$, SOX''s and JW26''s costs and ProfitMax''s normaliser read it, so moving it reshapes three cost curves'
    source: 'convention across the family; Sperry-2017 use the same 0.05'
    cite: Sperry-2017
    placeholder: false
    code: phylloptim::Leaf::k_crit_fraction
  vulnerability_x_end:
    section: vulnerability
    symbol: 'x_\mathrm{end}'
    units: '–'
    class: constant
    meaning: 'the end of a vulnerability curve, in x = (psi/b)^c: past it G is G(inf) to rounding and what is left, G(inf) - G, is read as zero; the end of both tables and the stem''s dry end for every curve psi_crit does not bound (#183)'
    source: code
    placeholder: false
    code: phylloptim::vulnerability_x_end
  vulnerability_curve_ncontrol:
    section: vulnerability
    symbol: 'n'
    units: '–'
    class: hyperparameter
    meaning: 'knot intervals in each vulnerability table over u = psi/b in [0, x_end^(1/c)] (n + 1 knots, plus graded levels near zero); recorded on the leaf and re-used by every set_traits() rebuild. Set through leaf_control(), which must equal Leaf::ncontrol_default'
    source: 'code: 800 puts the table within ~1e-14 of G(inf) of the closed form at the default c, and the Leaf''s two tables hold about the doubles the 400-knot cubic splines did'
    placeholder: false
    code: phylloptim::Leaf::vulnerability_curve_ncontrol
    default_code: phylloptim::Leaf::ncontrol_default

