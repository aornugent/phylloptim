    class: constant
    meaning: 'soft floor under the boundary layer''s split of the CO₂ path, on $d = 1 - (r_s - r_b)\hat g_c / g_{bw}$; a physical point has $d \ge r_b / r_s \approx 0.84$, so only a candidate past what the boundary layer can carry reaches it'
