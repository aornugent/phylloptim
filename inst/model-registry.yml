    units: '–'
    class: hyperparameter
    meaning: 'unit-cost ratio $c_V/c_E$ of least-cost theory, dimensionless because both fluxes are weighed in mol m⁻² s⁻¹; an input, strictly positive'
    source: 'caller input; default aligned to TF24 by align_curves() (#156); Prentice-2014 report 146, which at the default leaf pins the optimum at psi_crit from the reference psi_soil of 1 MPa drier'
    cite: Prentice-2014
    placeholder: false
    code: phylloptim::Leaf::LeastCost_beta

  # --- the residual (cuticular) conductance, #182 --------------------------------
  g_min:
    section: residual
    symbol: 'g_\min'
    units: 'mol H₂O m⁻² s⁻¹'
    class: trait
    meaning: 'residual (cuticular) conductance to water vapour at 25 °C: the water a leaf keeps losing after its stomata have shut, and the pathway through which CO₂ moves at the ratio ρ below; default 0, at which every term it enters is an exact zero'
    source: 'default 0 by design; measured cuticular conductances run 0.25–0.8 mmol m⁻² s⁻¹ (De Kauwe et al. 2022, cited in the companion manuscript); not a fitted Medlyn g₀, which is an order of magnitude larger'
    placeholder: false
    code: phylloptim::Leaf::g_min
  g_min_co2_ratio_:
    section: residual
    symbol: '\rho'
    units: '–'
    class: hyperparameter
    meaning: 'the cuticle''s conductance to CO₂ as a fraction of its conductance to water vapour; stomata are at 1/1.67'
    source: 'Boyer (2015, J. Exp. Bot. 66:2625, doi:10.1093/jxb/erv065): the cuticle''s conductance to CO₂ is 1/20 to 1/40 of its conductance to water vapour in grape and sunflower, in line with Boyer et al. (1997); 0.05 is the upper end'
    placeholder: false
    code: phylloptim::Leaf::g_min_co2_ratio_
  g_min_k_low_:
    section: residual
    symbol: 'k_\mathrm{lo}'
    units: 'K⁻¹'
    class: hyperparameter
    meaning: 'slope of log g_min in leaf temperature below the transition (Q10 ≈ 1.35 at the default)'
    source: 'placeholder: cuticular permeance rises with temperature, steeply above a wax phase transition near 35–45 °C (Riederer & Schreiber 2001; Schuster et al. 2016, reviewed in Duursma et al. 2018); inert at 25 °C and at g_min = 0'
    cite: Duursma-2018
    placeholder: true
    code: phylloptim::Leaf::g_min_k_low_
  g_min_k_high_:
    section: residual
    symbol: 'k_\mathrm{hi}'
    units: 'K⁻¹'
    class: hyperparameter
    meaning: 'the EXTRA slope of log g_min above the transition'
    source: 'placeholder, as k_lo'
    cite: Duursma-2018
    placeholder: true
    code: phylloptim::Leaf::g_min_k_high_
  g_min_T_trans_:
    section: residual
    symbol: 'T_t'
    units: '°C'
    class: hyperparameter
    meaning: 'the transition temperature at which the two slopes blend'
    source: 'placeholder, as k_lo'
    cite: Duursma-2018
    placeholder: true
    code: phylloptim::Leaf::g_min_T_trans_
  g_min_T_width_:
    section: residual
    symbol: 'w'
    units: 'K'
    class: hyperparameter
    meaning: 'the width over which the two slopes blend; the response is one smooth curve, never two slopes meeting at a point'
    source: 'placeholder, as k_lo'
    placeholder: true
    code: phylloptim::Leaf::g_min_T_width_
  residual_cap_power:
    section: residual
    symbol: 'p'
    units: '–'
    class: constant
    meaning: 'power of the soft minimum that caps the realised residual flux at what the stem can carry'
    source: 'chosen so the cap is inert to 5e-4 at half the cap and never a kink; a placeholder for the regime #183 leaves to a later step'
    placeholder: true
    code: phylloptim::Leaf::residual_cap_power
  residual_cap_fraction:
    section: residual
    symbol: '\phi'
    units: '–'
    class: constant
    meaning: 'the fraction of the stem''s flux ceiling the realised residual flux is capped at; below 1 so the shut stem''s potential stays finite'
    source: 'placeholder, as p'
    placeholder: true
    code: phylloptim::Leaf::residual_cap_fraction

  # --- Medlyn route, soil moisture and the closed form ---------------------------
  # --- medlyn -------------------------------------------------------------------
  g0:
    section: medlyn
    symbol: 'g_0'
    units: 'mol m⁻² s⁻¹'
    class: trait
    meaning: 'residual conductance of the Medlyn form; the code comment says µmol m⁻² s⁻¹, but it is added to $1.6\,A/(c_a/c_P)$, which is mol m⁻² s⁻¹; read only by the standalone Medlyn route'
    source: 'code default ("the published values", develop #450); no source recorded'
    placeholder: true
    code: phylloptim::Leaf::g0
  g1:
    section: medlyn
    symbol: 'g_1'
    units: 'kPa^{0.5}'
    class: trait
    meaning: 'slope of the Medlyn form; multiplied by the soil-moisture factor $\beta$ in the code; read only by the standalone Medlyn route (not the g1_eff diagnostic, which is derived from an operating point)'
    source: 'code default ("the published values", develop #450); no source recorded'
    placeholder: true
    code: phylloptim::Leaf::g1
  medlyn_ratio:
    section: medlyn
    symbol: '1.6'
    units: '–'
    class: constant
    meaning: 'H₂O:CO₂ diffusivity ratio of the Medlyn route: in the USO form, in its residual, and in converting the result to the CO₂ basis; deliberately not the settable H2O_CO2_stom_diff_ratio_ (1.67), because published g1 values are fitted with 1.6'
    source: Medlyn-2011 eq. 11
    cite: Medlyn-2011
    placeholder: false
    code: phylloptim::Leaf::medlyn_H2O_CO2_ratio
  theta:
    section: soil_moisture
    symbol: '\theta'
    units: 'm³ m⁻³'
    class: driver
    meaning: 'volumetric soil water content; the input, copied into the working copy `theta_` by every set_physiology (set this one, not `theta_`)'
    source: 'code default (the fixed value develop''s TF24 caller passed); no source recorded'
    placeholder: true
    code: phylloptim::Leaf::theta
    aliases: [phylloptim::Leaf::theta_]
  theta_fc:
    section: soil_moisture
    symbol: '\theta_{fc}'
    units: 'm³ m⁻³'
    class: driver
    meaning: 'soil water content at field capacity; the input, copied into `theta_fc_` by every set_physiology'
    source: 'code default (the fixed value develop''s TF24 caller passed); no source recorded'
    placeholder: true
    code: phylloptim::Leaf::theta_fc
    aliases: [phylloptim::Leaf::theta_fc_]
  theta_w:
    section: soil_moisture
    symbol: '\theta_w'
    units: 'm³ m⁻³'
    class: driver
    meaning: 'soil water content at the wilting point; the input, copied into `theta_w_` by every set_physiology'
    source: 'code default (the fixed value develop''s TF24 caller passed); no source recorded'
    placeholder: true
    code: phylloptim::Leaf::theta_w
    aliases: [phylloptim::Leaf::theta_w_]

equations:
  # --- biochemistry ------------------------------------------------------------
  arrhenius:
    section: biochemistry
    title: Arrhenius
    latex: |
      X(T) = X_{25}\, \exp\!\left[\frac{E_a\,(T_K - T_{25})}{T_{25}\, R\, T_K}\right], \qquad T_K = T + T_0
    code: phylloptim::Leaf::arrh_curve
    reads: [gas_constant, C_to_K, ref_temp]
    writes: [gamma_, kc_, ko_]
    kind: closed_form
    cite: Bernacchi-2001
    note: 'The plain form, normalised to 25 °C; $\Gamma^*$, $K_c$ and $K_o$ take it with the Bernacchi-2001 values, fitted to 10–40 °C, so above 40 °C it is extrapolation.'
  peaked_arrhenius:
    section: biochemistry
    title: Peaked Arrhenius
    latex: |
      X(T) = X_{25}\, \exp\!\left[\frac{E_a\,(T_K - T_{25})}{T_{25}\, R\, T_K}\right]
      \frac{1 + \exp\!\big[(\Delta S\, T_{25} - H_d)/(R\, T_{25})\big]}
           {1 + \exp\!\big[(\Delta S\, T_K - H_d)/(R\, T_K)\big]}
    code: phylloptim::Leaf::peak_arrh_curve
    reads: [gas_constant, C_to_K, ref_temp]
    writes: [vcmax_, jmax_]
    kind: closed_form
    cite: Medlyn-2002
    note: 'Medlyn-2002 eq. 17 at 298.15 K and the exact $R$ where the paper writes 298 K and 8.314; $V_{cmax}$ and $J_{max}$ take it with the six settable response parameters.'
  thermal_optimum:
    section: biochemistry
    title: Thermal optimum of the peaked form
    latex: |
      T_\mathrm{opt} = \frac{H_d}{\Delta S - R \ln\!\big[E_a/(H_d - E_a)\big]} - T_0
    code: ~
    also: [phylloptim::Leaf::d_S_shifted]
    reads: [gas_constant, C_to_K]
    writes: []
    kind: identity
    cite: Medlyn-2002
    note: 'Medlyn-2002 eq. 19. No binding reports it; the damage layer inverts it (entropy_shift).'
  temperature_block:
    section: biochemistry
    title: The temperature block
    latex: |
      V_{cmax}(T),\ J_{max}(T) \text{ by the peaked form};\qquad \Gamma^*(T),\ K_c(T),\ K_o(T) \text{ by the plain form}
    code: phylloptim::Leaf::update_temperature_dependent_params
    reads: [vcmax_25, vcmax_ha_, vcmax_H_d_, vcmax_d_S_, jmax_25, jmax_ha_, jmax_H_d_, jmax_d_S_, gamma_25_, gamma_ha_, kc_25_, kc_ha_, ko_25_, ko_ha_]
    writes: [vcmax_, jmax_, gamma_, kc_, ko_]
    kind: closed_form
    note: 'Seated once per set_physiology at the driver temperature and, with the energy balance on, per candidate operating point at the solved leaf temperature. A cache keyed on every scalar it reads (photo_temp_key) serves repeat calls.'
  michaelis_constant:
    section: biochemistry
    title: Michaelis constant in pascals
    latex: |
      K_m = K_c\, c_P \left(1 + \frac{1000\, O}{K_o\, c_P}\right), \qquad c_P = P \times 10^{3} \times 10^{-6}
    code: phylloptim::Leaf::update_temperature_dependent_params
    also: [phylloptim::Leaf::set_physiology]
    reads: [atm_o2_kpa, atm_kpa, umol_to_mol, kPa_to_Pa]
    writes: [km_]
    kind: closed_form
  electron_transport:
    section: biochemistry
    title: Electron transport
    latex: |
      J = \frac{I + J_{max} - \sqrt{(I + J_{max})^2 - 4\,\theta_J\, I\, J_{max}}}{2\,\theta_J}, \qquad I = \phi_J\, \alpha_\mathrm{PAR}\, Q
    code: phylloptim::Leaf::electron_transport
    reads: [phi_J, alpha_PAR_, PPFD, curv_fact_elec_trans]
    writes: [electron_transport_]
    kind: closed_form
    cite: Farquhar-1980
    note: 'Depends on temperature only through $J_{max}$.'
  assimilation:
    section: biochemistry
    title: Net assimilation
    latex: |
      W_c = \frac{V_{cmax}\,(c_i - \Gamma^* c_P)}{c_i + K_m}, \qquad
      W_j = \frac{J}{4}\,\frac{c_i - \Gamma^* c_P}{c_i + 2\,\Gamma^* c_P}, \qquad
      A = \frac{W_c + W_j - \sqrt{(W_c + W_j)^2 - 4\,\theta\, W_c W_j}}{2\,\theta} - R_d
    code: phylloptim::Leaf::assim_colimited
    also: [phylloptim::Leaf::assim_colimited_kernel, phylloptim::Leaf::assim_rubisco_limited_kernel, phylloptim::Leaf::assim_electron_limited_kernel, phylloptim::Leaf::photo_capacity]
    reads: [curv_fact_colim, atm_kpa]
    writes: [assim_colimited_]
    kind: closed_form
    cite: Farquhar-1980
    note: 'Net of dark respiration; $c_i$ in Pa.'
  thermal_cost:
    section: biochemistry
    title: Instantaneous thermal cost
    latex: |
      TC(T) = \frac{1}{1 + \exp\!\big[-r\,(T - T_{50})\big]}, \qquad r = \frac{2}{T_{50} - T_\mathrm{crit}}, \qquad J_{max} \leftarrow J_{max}\,(1 - TC)
    code: phylloptim::Leaf::thermal_cost_at
    also: [phylloptim::Leaf::update_temperature_dependent_params]
    reads: [use_thermal_cost_, T50_, Tcrit_]
    writes: [jmax_]
    kind: closed_form
    cite: Sicangco-2026
    note: 'Off by default; exactly zero with the gate off. Instantaneous, with no memory: not the damage layer.'

  # --- respiration ------------------------------------------------------------
  q10_respiration:
    section: respiration
    title: Leaf dark respiration
    latex: |
      R_d(T) = R_{d,25}\, Q_{10}(T)^{(T - 25)/10}, \qquad Q_{10}(T) = q_0 - q_1\, \frac{T + 25}{2}
    code: phylloptim::Leaf::update_temperature_dependent_params
    reads: [R_d_25, rd_q10_intercept_, rd_q10_slope_, ref_temp]
    writes: [R_d_]
    kind: closed_form
    cite: Tjoelker-2001
    note: 'Temperature in °C throughout. The $Q_{10}$ is evaluated at the midpoint of the measurement and reference temperatures, the code''s convention and neither paper''s.'

  # --- water vapour -----------------------------------------------------------
  saturation_vapour_pressure:
    section: vapour
    title: Saturation vapour pressure
    latex: |
      e_s(T) = 0.6108\, \exp\!\left(\frac{17.27\, T}{T + 237.3}\right)
    code: phylloptim::Leaf::saturation_vapour_pressure
    reads: [tetens_a, tetens_b, tetens_c]
    writes: []
    kind: closed_form
    note: 'Tetens, kPa, $T$ in °C.'
  saturation_vapour_pressure_slope:
    section: vapour
    title: Slope of the saturation curve
    latex: |
      \Delta(T) = \frac{17.27 \times 237.3\; e_s(T)}{(T + 237.3)^2}
    code: phylloptim::Leaf::saturation_vapour_pressure_slope
    reads: [tetens_b, tetens_c]
    writes: []
    kind: closed_form
    note: 'kPa K⁻¹, the exact derivative of the Tetens form. Reaches no reported output; it enters the energy-balance derivative only, through $\partial g_c/\partial T$, which is why FAO-56''s rounded 4098 (4.2e-5 low) put a 2e-5 error into that first-order condition until 0.15.4.'
  leaf_vpd:
    section: vapour
    title: Leaf-to-air deficit
    latex: |
      D_\mathrm{leaf} = \begin{cases} D_\mathrm{air} & g_\mathrm{EB} = 0 \\
      \max\!\big(D_\mathrm{air} + [e_s(T_\mathrm{leaf}) - e_s(T_\mathrm{air})],\; D_\min\big) & g_\mathrm{EB} = 1 \end{cases}
    code: phylloptim::Leaf::set_leaf_vpd
    also: [phylloptim::Leaf::leaf_vpd_at]
    reads: [use_energy_balance_, atm_vpd, vpd_leaf_min]
    writes: [vpd_leaf_, g_min_leaf_]
    kind: closed_form
    note: 'The bracketing is deliberate: at $T_\mathrm{leaf} = T_\mathrm{air}$ it is an exact zero and the prescribed path is bit-identical.'
  stomatal_conductance:
    section: vapour
    title: Conductance to CO₂ from the transpiration
    latex: |
      g_c = \frac{P\, (E - r^*) / M_w}{D_\mathrm{leaf}\; \times 1.67} + \rho\, g_\min(T_\mathrm{leaf})
    code: phylloptim::Leaf::stom_cond_CO2
    also: [phylloptim::Leaf::set_leaf_states_rates_from_psi_stem, phylloptim::Leaf::cuticular_cond_CO2]
    reads: [atm_kpa, kg_to_mol_h2o, H2O_CO2_stom_diff_ratio_, g_min_co2_ratio_]
    writes: [stom_cond_CO2_]
    kind: closed_form
    note: 'The TOTAL conductance to CO₂, mol m⁻² s⁻¹: Fick''s law on the STOMATAL flux $E - r^*$ (residual_flux), with $E$ in kg m⁻² s⁻¹, $P$ and $D_\mathrm{leaf}$ in kPa, plus the cuticle''s own conductance (#182). At $g_\min = 0$ the first term is the old expression bit for bit and the second an exact zero. Where $E < r^*$, a candidate below the wet bound that the solve hands the evaluator only by rounding, the stomatal flux reads as zero (the clamp site stomatal_flux). This is $\hat g_c$; with the energy balance on it passes through boundary_layer_co2_split, and off it is $g_c$ bit for bit.'

  boundary_layer_conductance:
    section: vapour
    title: Boundary-layer conductance to water vapour
    latex: |
      g_{bw} = \frac{1.075\, P / (R\, T_{\mathrm{air},K})}{r_a} \ \text{with the energy balance on}, \qquad g_{bw} = \infty \ \text{off it}
    code: phylloptim::Leaf::boundary_layer_cond_H2O
    reads: [use_energy_balance_, bl_vapour_heat_ratio, atm_kpa, kPa_to_Pa, gas_constant, C_to_K]
    writes: []
    kind: closed_form
    cite: Duursma-2015
    note: 'mol m⁻² s⁻¹; bound as `gb_H2O`. The molar density of air at air temperature over the aerodynamic resistance to heat, scaled to vapour for a hypostomatous leaf. The CO₂ path reads it through boundary_layer_co2_split.'
  boundary_layer_co2_split:
    section: vapour
    title: The boundary layer's share of the CO₂ path
    latex: |
      \frac{1}{g_c} = \frac{1}{\hat g_c} - \frac{r_s - r_b}{g_{bw}}, \qquad r_b = r_s^{2/3}, \qquad g_c = \frac{\hat g_c}{\max_{\mathrm{soft}}(d,\, d_0)}, \quad d = 1 - \frac{(r_s - r_b)\,\hat g_c}{g_{bw}}
    code: phylloptim::Leaf::boundary_layer_split_CO2
    also: [phylloptim::Leaf::boundary_layer_co2_excess, phylloptim::Leaf::boundary_layer_split_slope_at, phylloptim::Leaf::boundary_layer_cond_H2O]
    reads: [H2O_CO2_stom_diff_ratio_, bl_co2_split_floor, bl_co2_split_floor_width]
    writes: [stom_cond_CO2_]
    kind: closed_form
    cite: Sabot-2022
    note: 'With the energy balance on only (#122). $\hat g_c$ (stomatal_conductance) treats the whole leaf-to-air path as stomatal, at $r_s$; the boundary layer''s share diffuses at $r_b = r_s^{2/3}$, the laminar-layer scaling of Sabot et al. (2022) eq 10 (their 1.35 = 1.57$^{2/3}$). E is unchanged: the hydraulics set it, and the boundary layer changes what it says about CO₂. Every partial of $g_c$ is $d g_c / d\hat g_c$ times the same partial of $\hat g_c$, because $g_{bw}$ reads only drivers. The soft maximum is the plain series to the last bit at every physical point ($d \ge r_b/r_s$); it engages only where the deficit is on vpd_leaf_min.'
  stomatal_conductance_stomatal:
    section: vapour
    title: Stomatal conductance with the boundary layer removed
    latex: |
      g_{sw} = \left(\frac{1}{g_w} - \frac{1}{g_{bw}}\right)^{-1}, \qquad g_w = 1.67\, g_c \ \text{(the total leaf-to-air conductance, bound as gs\_H2O)}
    code: phylloptim::Leaf::stom_cond_stomatal_H2O
    also: [phylloptim::Leaf::stom_cond_H2O, phylloptim::Leaf::boundary_layer_cond_H2O]
    reads: [use_energy_balance_]
    writes: []
    kind: closed_form
    note: 'mol m⁻² s⁻¹; bound as `gs_stomatal_H2O`. Equal to the total, bit for bit, with the gate off or a shut leaf. Refused where $g_w \ge g_{bw}$: the transpiration is then more than the boundary layer can carry at that deficit and no finite stomatal conductance exists.'

  # --- the residual (cuticular) conductance, #182 --------------------------------
  g_min_temperature:
    section: residual
    title: The residual conductance at a leaf temperature
    latex: |
      g_\min(T) = g_\min \exp\!\Big( k_\mathrm{lo} (T - 25) + w\, k_\mathrm{hi} \big[\mathrm{sp}\big(\tfrac{T - T_t}{w}\big) - \mathrm{sp}\big(\tfrac{25 - T_t}{w}\big)\big] \Big),
      \qquad \mathrm{sp}(x) = \log(1 + e^{x})
    code: phylloptim::Leaf::g_min_factor
    also: [phylloptim::Leaf::g_min_at, phylloptim::Leaf::g_min_factor_temp_deriv, phylloptim::Leaf::set_leaf_vpd]
    reads: [g_min, g_min_k_low_, g_min_k_high_, g_min_T_trans_, g_min_T_width_]
    writes: []
    kind: closed_form
    cite: Duursma-2018
    note: 'One C∞ curve: slope $k_\mathrm{lo}$ below $T_t$, $k_\mathrm{lo} + k_\mathrm{hi}$ above it, blended over about $w$ degrees by a softplus, and exactly 1 at 25 °C so the trait is the reference value. Seated with the leaf-to-air deficit at every leaf temperature the solve establishes (set_leaf_vpd), so the two belong to one temperature; under the energy balance that is $T_\mathrm{leaf}(E)$ with $E$ the total flux, which the stem potential fixes, so the balance stays explicit without a linearisation. Its slope enters the energy-balance first-order condition beside the deficit''s (energy_balance_foc).'
  residual_flux:
    section: residual
    title: The residual (cuticular) flux, and its cap
    latex: |
      r = \frac{g_\min(T_\mathrm{leaf})\, D_\mathrm{leaf}}{P}\, M_w, \qquad
      E_\infty = k_{\max}\,[G(\infty) - G(\psi_\mathrm{up})], \qquad
      U_\infty = \sum_i \frac{G_r(\infty) - G_r(\psi_{\mathrm{soil},i})}{r_{H,i}}, \\
      \kappa(x, C) = x \Big(1 + \big(\tfrac{x}{\phi C}\big)^{8}\Big)^{-1/8}, \qquad
      C_U = U_\infty \Big(\frac{U_\infty}{U_\infty + r}\Big)^{2}, \qquad
      r^* = \kappa\big(\kappa(r, E_\infty),\, C_U\big);
      \qquad E = E_s + r^*
    code: phylloptim::Leaf::residual_flux
    also: [phylloptim::Leaf::residual_demand_at, phylloptim::Leaf::residual_cap, phylloptim::Leaf::supply_ceiling, phylloptim::Leaf::residual_demand_dT, phylloptim::Leaf::residual_cap_ddemand, phylloptim::Leaf::residual_cap_dceiling, phylloptim::Leaf::residual_root_cap, phylloptim::Leaf::residual_root_cap_ddemand, phylloptim::Leaf::residual_root_cap_dceiling_dr, phylloptim::Leaf::residual_root_ceiling_at, phylloptim::residual_cap_factor, phylloptim::MultiLayerRoots::uptake_limit, phylloptim::Leaf::residual_flux_dpsi_upstream, phylloptim::Leaf::residual_cond_temp_deriv, phylloptim::Leaf::residual_flux_at, phylloptim::Leaf::stem_complement_at]
    reads: [g_min, atm_kpa, kg_to_mol_h2o, leaf_specific_conductance_max, residual_cap_fraction]
    writes: [residual_flux_]
    kind: closed_form
    note: 'The demand $r$ is what the cuticle loses at the leaf''s temperature and deficit, in kg m⁻² s⁻¹. $E_\infty$ is the most the stem can ever carry from its upstream potential ($G(\infty) = (b/c)\Gamma(1/c)$, cached), and the soft minimum $\kappa$ caps the realised flux at $\phi E_\infty$ where the soil cannot supply the cuticle: inert while $r \ll \phi E_\infty$ ($(r/\phi E_\infty)^p/p$: 5e-4 at half the cap), never a min(), which would put a kink into $\psi_\mathrm{soil}$. The power is fixed at 8 by residual_cap_factor, which takes the eighth root by three square roots (residual_cap_power is asserted equal to it). On the collar route a second soft cap holds it below $\phi C_U$, where $U_\infty$ is the most the ROOTS can deliver from this soil: each layer''s uptake tends to $(G_r(\infty) - G_r(\psi_{\mathrm{soil},i}))/r_{H,i}$ as the collar dries (in kg, as $E_\mathrm{up}$), seated per solve (residual_root_ceiling_) and carried on the tape by the draw with its rows. Without it, as a layer approached the root integral''s cap the uptake''s limit fell to zero under a flux only the stem bounded, and the wet bound jumped ~10 MPa (#184). $C_U \approx U_\infty$ in every ordinary soil and falls as $U_\infty^3/r^2$ as the roots stop conducting, so the shut leaf reaches the dead soil''s gravity balance with a continuous value and slope (residual_root_ceiling_at). It is infinite, and inert bit for bit, on the stem routes and at $g_\min = 0$. The leaf optimises the STOMATAL flux $E_s$; the xylem carries the total, which the stem potential fixes through the supply relation as always, and every cost that reads the flux (cost_CF77, cost_TF24_floor, leastcost_flux, the ProfitMax normalisers) charges the total. Exactly zero at $g_\min = 0$. The regime $r > \phi E_\infty$, a leaf the soil cannot keep supplied, is the one a steady-state leaf has no answer for; #183 leaves it to a later step and this cap is a placeholder for it.'
  wet_bound:
    section: residual
    title: The wet bound, where uptake meets the residual flux
    latex: |
      E_\mathrm{up}(\psi_a) = r^*(\psi_a) \quad \text{(collar route)}, \qquad
      E(\psi_w; \psi_\mathrm{soil}) = r^*(\psi_\mathrm{soil}) \quad \text{(stem route)}
    code: phylloptim::Leaf::find_wet_bound
    also: [phylloptim::Leaf::stem_wet_bound, phylloptim::Leaf::find_shut_wet_bound, phylloptim::Leaf::supply_wet_floor, phylloptim::Leaf::supply_wet_ceiling, phylloptim::MultiLayerRoots::wet_floor_layer, phylloptim::MultiLayerRoots::wet_ceiling, phylloptim::Leaf::polish_bracket_bound, phylloptim::Leaf::prepare_collar_solve, phylloptim::Leaf::optimise_psi_stem_single]
    reads: [psi_crit]
    writes: []
    kind: identity
    note: 'The wet end of every solve: the collar (or, on a stem route, the stem potential) at which the water the supply delivers is exactly the cuticle''s loss, so the stomata are shut. At $g_\min = 0$ it is the zero-uptake collar $\psi_{r,0}$ (continuity_root), found by the same call with the same bracket, so that path is bit-identical. With $g_\min > 0$ the target is uptake less the realised residual flux, which rises with the collar; it can lie past $\psi_\mathrm{crit}$ when the soil is too dry to supply the cuticle inside it, and the bracket is widened until it changes sign. With a residual conductance the bound is a regular point (the cuticle still conducts CO₂), so a leaf that declines to open sits exactly on it, which removes the boundary-soil artefact #183 recorded; at $g_\min = 0$ it has no conductance, and the solve steps 1e-6 of the bracket inside as before.'
  shut_state:
    section: residual
    title: The shut leaf
    latex: |
      \psi_r^* = \psi_a, \qquad \psi_\mathrm{stem}^* = G^{-1}\!\big(E_\mathrm{up}(\psi_a)/k_{\max} + G(\psi_a)\big), \qquad
      E = r^*,\ E_s = 0,\ g_c = \rho\, g_\min(T_\mathrm{leaf}),\ J = h(A(c_i)) - C
    code: phylloptim::Leaf::set_shut_state
    also: [phylloptim::Leaf::prepare_collar_solve, phylloptim::Leaf::find_shut_wet_bound, phylloptim::Leaf::set_leaf_states_rates_from_psi_stem, phylloptim::Leaf::solve_ci, phylloptim::Leaf::assim_saturated]
    reads: [psi_crit]
    writes: [opt_psi_stem_, opt_root_psi_, profit_, transpiration_, stom_cond_CO2_, ci_, assim_colimited_, E_up_, residual_flux_]
    kind: closed_form
    note: 'Where the collar solve has no interval to optimise over (wettest layer at or past $\psi_\mathrm{crit}$; uptake at a collar held at $\psi_\mathrm{crit}$ below the residual flux; continuity root at or past $\psi_\mathrm{crit}$; a closed or inverted bracket), the leaf sits at its wet bound with its stomata shut, and every output is the ordinary evaluator''s there (leaf_state_chain): nothing is written by hand, so the shut leaf and the open leaf next to it are one function. At $g_\min = 0$ the collar is the zero-uptake collar and the stem sits AT it, the $E \to 0$ limit of the open leaf; the stem is no longer held at a critical potential, so it keeps equilibrating with a drying soil past $\psi_\mathrm{crit}$ (#183 decision 1). The bound is solved once, to collar precision, on the bracket between the lowest and highest gravity balance $\psi_i + z_i$ of the layers that still conduct; where none does (every layer past the root integral''s cap) it is the wettest layer''s balance, the limit it reaches from the wet side, so the shut leaf is continuous through the cap. With nothing conducting at all, $A$ is the root''s zero exactly. Light and heat shut no leaf: with the cuticle''s CO₂ pathway the supply–demand residual has a root for every leaf (intercellular_co2), and a leaf in the dark or too hot to fix carbon is an ordinary optimum, a net source whose $c_i$ sits above $c_a$. The kind `shade-death` and the no-flow family (`min(0, A(c_a))`, $c_i = c_a$) are gone.'

  # --- energy balance ----------------------------------------------------------
  atmospheric_emissivity:
    section: energy_balance
    title: Clear-sky emissivity
    latex: |
      e_a = 1000\,[e_s(T_\mathrm{air}) - D_\mathrm{air}] \ \text{Pa}, \qquad
      \varepsilon_B = c_\varepsilon\, (e_a / T_{\mathrm{air},K})^{1/7}, \qquad
      \varepsilon_a = \varepsilon_B - w_\varepsilon \ln\!\big(1 + e^{(\varepsilon_B - 1)/w_\varepsilon}\big)
    code: phylloptim::Leaf::set_physiology
    reads: [atm_vpd, atmos_emissivity_coef, atmos_emissivity_exponent, atmos_emissivity_softmin_width, C_to_K]
    writes: []
    kind: closed_form
    note: 'Brutsaert (1975) as Campbell & Norman write it, $e_a$ in pascals. A deficit at or past saturation ($e_a \le 0$) is refused. The fit passes 1 above 43.9 °C at a 2 kPa deficit; the soft minimum takes the longwave term to zero there smoothly, where a min() at 1 put a corner in every output''s slope in $T_\mathrm{air}$ and humidity. Bit-identical to the fit wherever $\varepsilon_B < 0.937$.'
  net_radiation:
    section: energy_balance
    title: Isothermal net radiation
    latex: |
      R_{n,\mathrm{iso}} = \alpha_\mathrm{PAR}\, \frac{Q}{c_Q} + \alpha_\mathrm{NIR}\, Q_\mathrm{NIR} - (1 - \varepsilon_a)\, \sigma\, T_{\mathrm{air},K}^4
    code: phylloptim::Leaf::set_physiology
    reads: [alpha_PAR_, PPFD, umol_par_per_joule, alpha_NIR_, NIR_int_, stefan_boltzmann, C_to_K]
    writes: [Rn_, Tair_]
    kind: closed_form
    cite: Duursma-2015
    note: 'The net radiation a leaf at air temperature would exchange; seated once per set_physiology from the drivers, which also stores the leaf_temp driver as the air temperature `Tair_`. The leaf''s own departure from air temperature is carried by the radiative conductance.'
  radiative_conductance:
    section: energy_balance
    title: Radiative conductance
    latex: |
      g_\mathrm{rad} = 4\, \varepsilon_l\, \sigma\, T_{\mathrm{air},K}^3
    code: phylloptim::Leaf::set_physiology
    reads: [leaf_emissivity, stefan_boltzmann, C_to_K]
    writes: [g_rad_]
    kind: closed_form
    cite: Duursma-2015
    note: 'The Stefan–Boltzmann emission linearised about $T_\mathrm{air}$, which keeps the balance explicit; the error is of order $(T_\mathrm{leaf} - T_\mathrm{air})/T_{\mathrm{air},K}$.'
  aerodynamic_resistance:
    section: energy_balance
    title: Aerodynamic resistance to heat
    latex: |
      r_a = C_{ra} \sqrt{d / U}, \qquad r_a = r_{a,\mathrm{fixed}} \text{ if } d \le 0 \text{ or } U \le 0
    code: phylloptim::Leaf::set_physiology
    reads: [aerodynamic_resistance_coef, aerodynamic_resistance_fixed, d_, wind_speed_]
    writes: [ra_]
    kind: closed_form
    note: 'Laminar boundary layer; no free-convection term and no within-canopy wind profile (#7). A non-finite $d$ or $U$ with the gate on is refused.'
  leaf_temperature:
    section: energy_balance
    title: Leaf temperature at a prescribed transpiration
    latex: |
      T_\mathrm{leaf}(E) = T_\mathrm{air} + \frac{R_{n,\mathrm{iso}} - \lambda_v E}{\rho c_p / r_a + g_\mathrm{rad}}, \qquad
      \frac{dT_\mathrm{leaf}}{dE} = -\frac{\lambda_v}{\rho c_p / r_a + g_\mathrm{rad}}
    code: phylloptim::Leaf::leaf_temp_from_E
    reads: [latent_heat_vap, vol_heat_cap_air]
    writes: [Tleaf_]
    kind: closed_form
    note: 'Explicit, not iterated: $E$ is fixed by the hydraulic supply at the candidate potential and the balance gives the temperature at which the leaf sheds the rest as sensible heat and extra longwave. The one place $T_\mathrm{leaf}$ and $dT_\mathrm{leaf}/dE$ are computed. No clamp: set_physiology refuses drivers under which the leaf, between $E = 0$ and $E = K_{max} G(\infty)$, would reach the Tetens pole or a non-positive $Q_{10}$ of $R_d$ (check_leaf_temperature_range).'
  energy_balance_foc:
    section: energy_balance
    title: The energy-balance term of the first-order condition
    latex: |
      \Delta_\mathrm{EB} = \tau\, \frac{A_T\, g_c / P \;+\; A'\, (\partial g_c/\partial T)\,(c_a - c_i)/P}{g_{ci}}, \qquad
      \tau = \frac{dT_\mathrm{leaf}}{dE}\, \frac{dE}{d\psi}, \qquad
      \frac{\partial g_c}{\partial T} = -\, g_c\, \frac{\Delta(T_\mathrm{leaf})}{D_\mathrm{leaf}} \quad (0 \text{ on the floor } D_\min)
    code: phylloptim::Leaf::dprofit_energy_balance_term
    also: [phylloptim::Leaf::temp_deriv, phylloptim::Leaf::vcmax_temp_deriv, phylloptim::Leaf::thermal_cost_temp_deriv]
    reads: [fd_step, ca, vpd_leaf_min, use_energy_balance_]
    writes: []
    kind: derivative
    note: '$A_T = \partial A/\partial T_\mathrm{leaf}$ at fixed $c_i$ is a central difference of the temperature block with the fixed step $h$. The term is not observable on its own: it reaches the outputs only through the stem-route derivative.'

  # --- damage, repair and acclimation ---------------------------------------------
  acclimation_shift:
    section: damage
    title: Acclimation shift of the photosynthetic optimum
    latex: |
      \delta = \delta_0 + \Delta T_{\max}\, \frac{A}{A + K_A}, \qquad A > -K_A
    code: phylloptim::Leaf::update_temperature_dependent_params
    reads: [use_thermal_damage_, topt_offset_, dTopt_max_, K_A_, A_]
    writes: []
    kind: closed_form
    note: 'The same shift moves both peaked-Arrhenius optima. $A$ is read as itself: $A \ge 0$ is invariant under the dynamics, so a max(A, 0) never bound, and without it the shift is smooth through zero. $A \le -K_A$, the pole, is refused.'
  entropy_shift:
    section: damage
    title: Entropy term that moves the optimum
    latex: |
      \Delta S'(\delta) = \frac{H_d}{T_{\mathrm{opt},0} + \delta} + R \ln\frac{E_a}{H_d - E_a}, \qquad
      T_{\mathrm{opt},0} = \frac{H_d}{\Delta S - R \ln[E_a/(H_d - E_a)]}
    code: phylloptim::Leaf::d_S_shifted
    reads: [gas_constant, shifted_temp_min, shifted_temp_max]
    writes: [vcmax_, jmax_]
    kind: closed_form
    note: 'The thermal optimum inverted for the entropy term that puts it $\delta$ K higher; refuses $E_a \le 0$ or $H_d \le E_a$, where no optimum exists, and a shifted optimum outside [250, 350] K.'
  functional_fraction:
    section: damage
    title: Functional fraction
    latex: |
      F = F_0 + F_\min \ln\!\big(1 + e^{-F_0/F_\min}\big), \quad F_0 = 1 - I - D, \qquad V_{cmax} \leftarrow F\, V_{cmax}, \qquad J_{max} \leftarrow F\, J_{max}
    code: phylloptim::Leaf::update_temperature_dependent_params
    reads: [use_thermal_damage_, I_, D_, damage_surv_floor]
    writes: [functional_, vcmax_, jmax_]
    kind: closed_form
    note: 'The states enter the benefit through capacity and never the hydraulic cost; $R_d$ is not scaled. A soft floor of width $F_\min$: exactly $F_0$ wherever $F_0 > 3.4 \times 10^{-5}$, positive and falling through $F_0 = 0$. $I < 0$ and $D < 0$ are refused, so $F_0 \le 1$.'
  respiration_costs:
    section: damage
    title: Maintenance costs added to respiration
    latex: |
      R_d \leftarrow R_d + c_A\, A + c_\mathrm{rep}\, k_\mathrm{rec} + c_\mathrm{prot}\, (k_{i,\mathrm{base}} - k_i) + c_\mathrm{flux}\, k_\mathrm{rec,eff}\, I
    code: phylloptim::Leaf::update_temperature_dependent_params
    reads: [use_thermal_damage_, c_acclim_maint_, c_repair_maint_, c_protect_maint_, c_repair_flux_, k_i_baseline_, k_i_, k_rec_, A_, I_]
    writes: [R_d_]
    kind: closed_form
    note: 'Added after the $Q_{10}$ response, so the gate-off arithmetic is untouched; all four prices default to zero on the leaf. Protection is signed: the default $k_i$ equals the baseline, where a max(0, .) put a corner.'
  softplus:
    section: damage
    title: Softplus
    latex: |
      \mathrm{softplus}(x; s) = \frac{\ln(1 + e^{s x})}{s}
    code: phylloptim::damage::softplus
    reads: [softplus_switch]
    writes: []
    kind: closed_form
    note: 'No clamp: above $s x = 30$ it is evaluated as $s x + \ln(1 + e^{-s x})$, which cannot overflow; below, $e^{s x}$ underflows harmlessly.'
  delta_impair:
    section: damage
    title: Acclimation shift of the impairment isokinetic temperature
    latex: |
      \delta_\mathrm{imp} = \delta_0 + \Delta T_{\mathrm{imp},\max}\, \frac{A}{A + K_A}, \qquad A > -K_A
    code: phylloptim::damage::delta_impair
    also: [phylloptim::Leaf::delta_impair_at, phylloptim::Leaf::update_temperature_dependent_params]
    reads: [topt_offset_, dTimpair_max_, K_A_, A_]
    writes: []
    kind: closed_form
  centred_arrhenius:
    section: damage
    title: The layer's one rate form
    latex: |
      k(T) = k\, \exp\!\left[\frac{E_a}{R}\left(\frac{1}{T_{\mathrm{ref},K}} - \frac{1}{T_K}\right)\right]
    code: phylloptim::damage::centred_arrhenius
    reads: [gas_constant, C_to_K]
    writes: []
    kind: closed_form
    note: 'Exactly $k$ at $T_\mathrm{ref}$ and at $E_a = 0$, where the argument is an exact zero. Impairment, repair and maturation all take it; nothing in the layer switches on or off. No clamp on the argument (it used to be held to [−30, 30], which a high-$E_a$ species reaches below about 25 °C); an overflow is refused.'
  impairment_rate:
    section: damage
    title: Impairment rate
    latex: |
      k_\mathrm{imp}(T) = k_i\, \exp\!\left[\frac{E_{a,i}}{R}\left(\frac{1}{T'_{\mathrm{iso},K}} - \frac{1}{T_K}\right)\right], \qquad
      T'_{\mathrm{iso},K} = T_\mathrm{iso} + T_0 + \delta_\mathrm{imp} \in [250, 350]
    code: phylloptim::damage::k_imp
    also: [phylloptim::Leaf::k_imp_eff, phylloptim::damage::centred_arrhenius]
    reads: [k_i_, k_i_Ea_, k_i_Tiso_, C_to_K, gas_constant, shifted_temp_min, shifted_temp_max]
    writes: [k_imp_eff_]
    kind: closed_form
    cite: Bison-2026
    note: 'First-order PSII heat inactivation written about the Meyer–Neldel isokinetic temperature, so $E_{a,i}$ pivots the curve about $T_\mathrm{iso}$ rather than moving it. Unbounded in temperature. Reported at the temperature the block is seated at; enters no objective.'
  k_rec_eff:
    section: damage
    title: Repair rate
    latex: |
      k_\mathrm{rec,eff}(T) = k_\mathrm{rec}\, \exp\!\left[\frac{E_{a,\mathrm{rec}}}{R}\left(\frac{1}{T_{25,K}} - \frac{1}{T_K}\right)\right]
    code: phylloptim::damage::k_rec_eff
    also: [phylloptim::Leaf::k_rec_eff, phylloptim::damage::centred_arrhenius]
    reads: [k_rec_, k_rec_Ea_, damage_Tref, C_to_K, gas_constant]
    writes: [k_rec_eff_]
    kind: closed_form
    note: 'Does not shut off when hot: impairment outruns the default repair above about 32 °C.'
  k_mat_eff:
    section: damage
    title: Maturation rate
    latex: |
      k_\mathrm{mat,eff}(T) = k_\mathrm{mat}\, \exp\!\left[\frac{E_{a,\mathrm{mat}}}{R}\left(\frac{1}{T_{25,K}} - \frac{1}{T_K}\right)\right]
    code: phylloptim::damage::k_mat_eff
    also: [phylloptim::damage::centred_arrhenius]
    reads: [k_mat_, k_mat_Ea_, damage_Tref, C_to_K, gas_constant]
    writes: []
    kind: closed_form
  damage_rates:
    section: damage
    title: The dynamics
    latex: |
      \frac{dA}{dt} = \alpha_A\, \mathrm{softplus}(T - T_\mathrm{accl};\, s) - \beta_A\, A, \qquad
      \frac{dI}{dt} = k_\mathrm{imp}(T)\, F - \big(k_\mathrm{rec,eff}(T) + k_\mathrm{mat,eff}(T)\big)\, I, \qquad
      \frac{dD}{dt} = k_\mathrm{mat,eff}(T)\, I, \qquad F = 1 - I - D
    code: phylloptim::damage::rates
    also: [phylloptim::Leaf::damage_rates]
    reads: [acclim_alpha_, acclim_beta_, acclim_T_, acclim_s_]
    writes: []
    kind: closed_form
    note: 'Per day, $T$ the leaf temperature. $F$ confines fresh impairment to functional leaf, so $I + D \le 1$ without a clamp. A detached leaf has no sink for $D$; TF24t adds one.'
  damage_trajectory:
    section: damage
    title: The integrator
    latex: |
      \text{RK4 on a piecewise-linear } T(t),\ \text{each interval cut into } m = \max\!\Big(1,\ \Big\lceil \frac{\Delta t\, k_\mathrm{fastest}}{0.1} \Big\rceil,\ \Big\lceil \frac{|\Delta T|}{0.25} \Big\rceil\Big) \text{ sub-steps}
    code: phylloptim::damage::trajectory
    also: [phylloptim::Leaf::damage_trajectory]
    reads: [rk_rate_step, rk_temp_step, acclim_beta_, topt_offset_, dTimpair_max_]
    writes: []
    kind: integrator
    note: '$k_\mathrm{fastest}$ is the largest of $k_\mathrm{imp} + k_\mathrm{rec,eff} + k_\mathrm{mat,eff} + \beta_A$ at the two ends of the interval, impairment at its smallest isokinetic shift. The sub-step count is chosen from values, so a gradient through it is the derivative of the discrete map.'

  # --- vulnerability and supply --------------------------------------------------
  # --- vulnerability -----------------------------------------------------------
  weibull_scale:
    section: vulnerability
    title: Weibull scale from P50
    latex: |
      b = \frac{P_{50}}{(\ln 2)^{1/c}}, \qquad b_r = \frac{P_{50,r}}{(\ln 2)^{1/c_r}}
    code: phylloptim::Leaf::derive_vulnerability_curves_from_P50
    also: [phylloptim::weibull_b_from_P50, phylloptim::Leaf::weibull_b_from_P50]
    reads: [stem_P50, stem_c, root_P50, root_c]
    writes: [stem_b, root_b]
    kind: closed_form
    note: 'Seated by the constructor (derive_vulnerability_curves_from_P50) and by set_traits() through the same weibull_b_from_P50. With it $\exp[-(\psi/b)^c] = 2^{-(\psi/P_{50})^c}$ identically (vignette Appendix A).'
  critical_potential:
    section: vulnerability
    title: Critical potential (P95)
    latex: |
      \psi_\mathrm{crit} = b\,\big[\ln(1/f_\mathrm{crit})\big]^{1/c}, \qquad
      \psi_{\mathrm{crit},r} = b_r\,\big[\ln(1/f_\mathrm{crit})\big]^{1/c_r}, \qquad f_\mathrm{crit} = 0.05
    code: phylloptim::Leaf::derive_vulnerability_curves_from_P50
    also: [phylloptim::Leaf::weibull_psi_at_fraction]
    reads: [stem_b, stem_c, root_b, root_c, k_crit_fraction]
    writes: [psi_crit, root_psi_crit]
    kind: closed_form
    cite: Sperry-2017
    note: 'A quantile of the curve, not a trait. It ends the solve''s domain only for the curves whose own forms end there (cost_domain_ends_at_psi_crit); for the rest the stem may run past it (#183).'
  weibull_vulnerability:
    section: vulnerability
    title: Stem vulnerability curve
    latex: |
      f(\psi) = \exp\!\big[-(\psi/b)^{c}\big] = 2^{-(\psi/P_{50})^{c}}
    code: phylloptim::Leaf::proportion_of_conductivity
    also: [phylloptim::Leaf::proportion_of_conductivity_kernel]
    reads: [stem_b, stem_c]
    writes: []
    kind: closed_form
    note: 'The fraction of maximum conductivity left at $\psi$, evaluated in closed form at every potential (no table, no clamp); it also supplies the tables'' knot slopes.'
  vulnerability_psi_end:
    section: vulnerability
    title: The end of a vulnerability curve
    latex: |
      \psi_\mathrm{end} = b\,x_\mathrm{end}^{1/c}, \qquad x_\mathrm{end} = 40
    code: phylloptim::vulnerability_psi_end
    also: [phylloptim::Leaf::stem_curve_end_at, phylloptim::Leaf::dry_end]
    reads: [vulnerability_x_end]
    writes: []
    kind: closed_form
    note: 'Past it $F$ differs from $F(\infty)$ by less than a double resolves (15.44 MPa at the defaults). Both tables end here, with the last knot at $\psi_\mathrm{end}$ exactly (#92) and holding $F(\infty)$; it is the stem''s dry end for every curve $\psi_\mathrm{crit}$ does not bound (#183).'
  cumulative_vulnerability_integral:
    section: vulnerability
    title: Cumulative vulnerability integral
    latex: |
      F(\psi) = \int_0^{\psi} f(s)\,ds = \frac{b}{c}\,\gamma\!\big(1/c,\ (\psi/b)^{c}\big),\quad F(\psi \le 0) = 0, \qquad
      F(\infty) = \frac{b}{c}\,\Gamma(1/c)
    code: phylloptim::cumulative_vulnerability_integral_at
    also: [phylloptim::cumulative_vulnerability_integral_limit, phylloptim::vulnerability_table]
    reads: []
    writes: []
    kind: closed_form
    note: '$\gamma$ is the lower incomplete gamma (boost in the code). The code reads it where it is exact: to seed the tables'' knots. It is the reference the tables are held to, and not read on the hot path, where one call costs ~50 table reads.'
  vulnerability_table:
    section: vulnerability
    title: The vulnerability tables
    latex: |
      F(\psi) = b\,g(\psi/b), \qquad g(u) = \int_0^{u} e^{-s^{c}}\,ds; \qquad
      u_i = u_\mathrm{end}\, i/n,\ u_\mathrm{end} = x_\mathrm{end}^{1/c}; \quad \text{on } [u_i, u_{i+1}],\ t = (u - u_i)/h: \\
      \hat g(u) = \textstyle\sum_{k=0}^{5} a_{i,k}\, t^k, \quad \hat g, \hat g', \hat g'' = g, g', g'' \text{ at both knots}\ (i < i_q); \\
      \hat g(u) = g(\infty) - e^{\hat L(u)},\ \hat L(u) = \textstyle\sum_{k=0}^{5} a_{i,k}\, t^k,\ \hat L, \hat L', \hat L'' = \ln q, (\ln q)', (\ln q)'' \text{ at both knots}\ (i \ge i_q),\ q = g(\infty) - g; \\
      \hat F' = \hat g'(\psi/b); \quad \hat F = F(\infty) \text{ past } u_\mathrm{end}
    code: phylloptim::vulnerability_table
    also: [phylloptim::vulnerability_integral, phylloptim::vulnerability_integral_deriv, phylloptim::vulnerability_psi_end, phylloptim::Leaf::setup_transpiration, phylloptim::MultiLayerRoots::setup_vulnerability]
    reads: [vulnerability_curve_ncontrol, vulnerability_x_end]
    writes: []
    kind: closed_form
    note: 'A quintic Hermite interpolant in $u$ whose knot values, slopes and curvatures are exact, so $\hat F$ is C2 across every knot (#183) and its slope, read from the same polynomial, is the derivative of the value the solve reads. Below the first 8 spans the grid is graded in dyadic levels of 8 spans each, so the $u^c$ behaviour at zero is resolved without a pow. From the first knot $i_q$ where $q \le g/1024$ (x ~ 5.6 at the default $c$; set by the cost of an exp per read, not by accuracy) the spans hold $\ln q$, the log of what is left, from the upper incomplete gamma: near $F(\infty)$ a quintic in $g$ resolves nothing (its knot differences fall below an ulp of $g(\infty)$, and its slope is rounding past $x \approx 25$), while $\ln q$ is nearly a polynomial and keeps $q$ and the conductivity to their own relative precision to the end of the curve (#190). Measured against a 50-digit reference at 800 intervals: $|\hat F - F| \le$ 2e-15 $F(\infty)$ at the default $c$, 2.7e-12 at $c$ = 1.2; in the tail $q$ to 8e-14 of itself and $\hat g''$ to 4e-12 of itself for $c$ from 1.2 to 12; the cubic splines this replaced reached 8.7e-11. The table depends on $c$ alone, so a P50 moves nothing in it, and it is shared between copies and between the stem and the root where their $c$ agree.'
  stem_vulnerability_integral:
    section: vulnerability
    title: The stem integral as the code reads it
    latex: |
      \tilde F(\psi) = b\,\hat g(\psi/b) \ \ (\psi \le \psi_\mathrm{end}), \qquad F(\infty) \ \ (\psi > \psi_\mathrm{end})
    code: phylloptim::Leaf::stem_curve_integral
    also: [phylloptim::Leaf::setup_transpiration, phylloptim::Leaf::perturb_stem_P50, phylloptim::Leaf::stem_curve_limit]
    reads: [stem_b]
    writes: []
    kind: closed_form
    note: 'A negative potential is a stem_curve_domain error. perturb_stem_P50() moves $b$ and leaves the table, which depends on $c$ alone.'
  root_vulnerability:
    section: vulnerability
    title: Root conductivity as the code reads it
    latex: |
      f_r(\psi) = \exp\!\big[-(\psi/b_r)^{c_r}\big], \qquad f_r(\psi \le 0) = 1
    code: phylloptim::MultiLayerRoots::root_vuln_at
    also: [phylloptim::MultiLayerRoots::setup_vulnerability, phylloptim::Leaf::setup_root_vulnerability]
    reads: [root_b, root_c]
    writes: []
    kind: closed_form
    note: 'The closed form at every potential (#85): no table and no clamp. It underflows to zero far past the curve (~46 MPa at the defaults), and the one reader that divided by it, the equal-potentials branch of the uptake walk, takes the layer flux as $-z f_r/(r_H + r_V f_r)$, so a fully embolised layer draws nothing. Not bound.'
  root_vulnerability_integral:
    section: vulnerability
    title: Root integral as the code reads it
    latex: |
      \tilde F_r(\psi) = b_r\,\hat g_r(\psi/b_r) \ \ (\psi \le \psi_{\mathrm{end},r}), \qquad F_r(\infty) \ \ \text{beyond}
    code: phylloptim::MultiLayerRoots::root_vuln_integral_at
    also: [phylloptim::MultiLayerRoots::setup_vulnerability, phylloptim::Leaf::setup_root_vulnerability, phylloptim::MultiLayerRoots::root_vuln_integral_limit]
    reads: [root_b]
    writes: []
    kind: closed_form
    note: 'The root''s table, the stem''s own where their $c$ agree; no cap (#85). It approaches $F_r(\infty)$ as the layer dries; from a lower end in the tail a layer''s integral is $\tilde Q_r(\psi_\mathrm{lo}) - \tilde Q_r(\psi_\mathrm{hi})$, a layer conducts while $\tilde Q_r > 0$ (to the end of the curve, not to where $\tilde F_r$ rounds to $F_r(\infty)$), and uptake_limit reads $\tilde Q_r$ directly (#190). So the reverse flux into a drying layer tends to the whole area under the conductivity curve over $r_{H,\min}$ (#1). No binding: read through E_from_Soil_to_Root_Collar on the general branch, where the layer flux is $(\psi_c - \psi_s - \rho_w g z)\,\hat F/(r_{H,\min}\,\Delta\psi)$ at $r_{V,\Sigma} = 0$.'

  # --- supply ------------------------------------------------------------------
  stem_transpiration:
    section: supply
    title: Stem supply
    latex: |
      E(\psi_\mathrm{stem}; \psi_\mathrm{up}) = k_{max}\big[\tilde F(\psi_\mathrm{stem}) - \tilde F(\psi_\mathrm{up})\big]
      \;\approx\; k_{max}\!\int_{\psi_\mathrm{up}}^{\psi_\mathrm{stem}} f(u)\,du, \qquad
      E = k_{max}\big[\tilde Q(\psi_\mathrm{up}) - \tilde Q(\psi_\mathrm{stem})\big],\ \tilde Q = F(\infty) - \tilde F \ \text{ where } \psi_\mathrm{up} \text{ is in the tail}
    code: phylloptim::Leaf::transpiration
    also: [phylloptim::Leaf::stem_curve_integral, phylloptim::Leaf::stem_curve_complement, phylloptim::Leaf::stem_curve_in_tail, phylloptim::Leaf::setup_transpiration]
    reads: [leaf_specific_conductance_max, stem_b, stem_c]
    writes: []
    kind: closed_form
    cite: Sperry-2017
    note: 'kg m⁻² s⁻¹. $\psi_\mathrm{up}$ is the collar on the collar route and $\psi_\mathrm{soil}$ on the stem route; a reversed pair ($\psi_\mathrm{stem} < \psi_\mathrm{up}$) is refused, and equality gives exactly zero (#31). A one-entry memo keyed on the two potentials (invalidated by set_physiology and perturb_stem_P50) returns the same value bit for bit. From an upstream potential in the table''s tail the flux is a difference of what is left, $\tilde Q$, which keeps the digits $F(\infty)$ swamps in a difference of $\tilde F$ (#190); transpiration_at forms the same difference on the same test.'
  stem_transpiration_quadrature:
    section: supply
    title: Stem supply by direct quadrature
    latex: |
      E_\mathrm{quad} = k_{max}\,\mathrm{Simpson}_{\epsilon}\!\int_{\psi_\mathrm{up}}^{\psi_\mathrm{stem}} f(u)\,du \;\to\; k_{max}\big[F(\psi_\mathrm{stem}) - F(\psi_\mathrm{up})\big]
    code: phylloptim::Leaf::transpiration_full_integration
    also: [phylloptim::Leaf::proportion_of_conductivity, phylloptim::Leaf::proportion_of_conductivity_kernel]
    reads: [leaf_specific_conductance_max, stem_b, stem_c]
    writes: []
    kind: integrator
    note: 'An independent check on the table, not on the production path: adaptive Simpson at absolute tolerance $\epsilon$ = integration_tol (initialize_integrator(), default 1e-8), against the closed form. It converges to it: measured max |error| at $k_{max} = 1$ and three stem curves is 2.7e-06 at $\epsilon$ = 1e-6, 1.7e-08 at 1e-8 (the default; 1.7x the requested tolerance at $c = 5$, the local Simpson criterion not being a global bound), 4.2e-11 at 1e-10, 4.4e-13 at 1e-12 and 2.7e-15 at 1e-14, the rounding floor.'
  stem_transpiration_inverse:
    section: supply
    title: Stem potential from a transpiration
    latex: |
      \psi_\mathrm{stem} = \tilde F^{-1}\!\big(E/k_{max} + \tilde F(\psi_\mathrm{up})\big), \qquad
      \psi_\mathrm{stem} = \tilde Q^{-1}\!\big(\tilde Q(\psi_\mathrm{up}) - E/k_{max}\big) \ \text{where } \psi_\mathrm{up} \text{ is in the tail}, \qquad
      \psi_\mathrm{stem} = \psi_\mathrm{up} \ \text{if } E = 0 \text{ and } \psi_\mathrm{up} \ge \psi_\mathrm{end}
    code: phylloptim::Leaf::transpiration_to_psi_stem
    also: [phylloptim::Leaf::psi_stem_carrying, phylloptim::Leaf::stem_curve_integral, phylloptim::Leaf::stem_curve_integral_inverse, phylloptim::Leaf::stem_curve_complement_inverse, phylloptim::vulnerability_integral_inverse, phylloptim::vulnerability_complement_inverse]
    reads: [leaf_specific_conductance_max, stem_b, stem_c]
    writes: []
    kind: closed_form
    note: 'The table inverted: a cubic Hermite start in the knots'' own $(\hat g, u)$ with the exact inverse slopes, then Newton on the table''s value and slope, so the two directions are mutual inverses to rounding; in the tail the same on $\hat L$, from $\tilde Q$, so a stem potential is placed to its own conditioning however little the stem has left. Infeasible (stem_curve_domain) where the target is negative or past $F(\infty)$ beyond a few ulps of $F(\infty)$: no stem potential carries that flow; $F(\infty)$ itself is the end of the curve. Past the end the curve is flat, so a zero flux returns the upstream potential rather than inverting.'
  layer_midpoints:
    section: supply
    title: Layer midpoints and gravity head
    latex: |
      z_i = \tfrac{1}{2}(d_{i-1} + d_i),\ d_0 = 0, \qquad h_i = \rho_w g\, z_i
    code: phylloptim::MultiLayerRoots::set_soil_state
    reads: [soil_depth, gravity_head]
    writes: [soil_depth_, z_soil_mid_, soil_number_of_depths_]
    kind: closed_form
    note: 'Correct at any layer spacing (#626). The head $h_i$ is not bound; it enters through multilayer_uptake. Plant may supply precomputed midpoints instead (use_precomputed_z_soil_mid_), a path not reachable from R.'
  root_network_from_carbon:
    section: supply
    title: Root resistances from root carbon
    latex: |
      \Delta z_i = d_i - d_{i-1}, \quad c_{V,i} = C_i/3, \quad c_{H,i} = 2C_i/3, \quad
      r_{H,\min,i} = \frac{\beta_{R,H}}{c_{H,i}}, \quad r_{V,i} = \frac{\beta_{R,V}\,\Delta z_i^2}{c_{V,i}}, \quad
      r_{V,\Sigma,i} = \sum_{j \le i} r_{V,j}
    code: phylloptim::root_network_from_carbon
    also: [phylloptim::layer_thicknesses]
    reads: [beta_R_H, beta_R_V]
    writes: [c_r_V_, c_r_H_, r_R_H_min, r_R_V, r_R_V_sum, max_soil_layer]
    kind: closed_form
    cite: Potkay-2021
    note: '$C_i$ is root carbon per unit leaf area, kg C m⁻² (hazard 4: absolute carbon gives resistances wrong by the leaf area, silently). The network is truncated at the deepest layer with carbon, which set_physiology stores as max_soil_layer; an interior zero-carbon layer gets $r_{H,\min} = 0$ (infinite conductance, backwards, preserved) and passes the running sum through. A helper the caller runs, not part of the solve (#33): the leaf reads only $r_{H,\min}$ and $r_{V,\Sigma}$. $\Delta z_i^2$ per layer is what makes $\sum r_V$ independent of the slicing (#626).'
  multilayer_uptake:
    section: supply
    title: Multi-layer root uptake
    latex: |
      E_i = \frac{\psi_c - \psi_{s,i} - \rho_w g z_i}{r_{H,\min,i}\,\Delta\psi_i / I_i + r_{V,\Sigma,i}}, \qquad
      E_\mathrm{up} = M_w \sum_{i \le L} E_i \\
      \Delta\psi_i = |\psi_c - \psi_{s,i}|,\quad
      I_i = \hat F_r(\psi_\mathrm{hi}) - \hat F_r(\max(\psi_\mathrm{lo}, 0)) + \max(0, -\psi_\mathrm{lo}) \\
      E_i = \frac{-\rho_w g z_i}{r_{H,\min,i}/\hat f_r(\psi_c) + r_{V,\Sigma,i}} \ \text{if } |\psi_c - \psi_{s,i}| < 10^{-8}, \qquad
      E_i = 0 \ \text{if } |\psi_c - \psi_{s,i} - \rho_w g z_i| < 10^{-8}
    code: phylloptim::MultiLayerRoots::uptake_impl
    also: [phylloptim::MultiLayerRoots::uptake_at, phylloptim::MultiLayerRoots::supply_over, phylloptim::MultiLayerRoots::held_supply, phylloptim::MultiLayerRoots::set_soil_state, phylloptim::MultiLayerRoots::set_root_network, phylloptim::Leaf::E_from_Soil_to_Root_Collar]
    reads: [psi_soil, gravity_head, kg_per_mol_h2o, r_R_H_min, r_R_V_sum]
    writes: [E_up_, soil_consumption_]
    kind: closed_form
    cite: Potkay-2021
    note: 'Per rooted layer ($i \le L$ = max_soil_layer) in parallel to the collar: the horizontal resistance is $r_{H,\min}$ over the MEAN root conductivity across the span between the collar and the layer ($\psi_\mathrm{lo}, \psi_\mathrm{hi}$ its ends), from two reads of the root integral; conductivity is 1 at negative (positive-pressure) potentials. $E_i < 0$ is a layer gaining water (hydraulic redistribution). soil_consumption_ keeps $E_i$ in mol m⁻² s⁻¹ and E_up_ is in kg (the unit split is deliberate); unrooted layers stay 0.'
  single_series_supply:
    section: supply
    title: Single-potential supply
    latex: |
      E_\mathrm{up} = M_w\,\frac{\psi_c - \psi_s - h}{r}
    code: phylloptim::SinglePotential::uptake_from
    also: [phylloptim::SinglePotential::set_soil_state, phylloptim::SinglePotential::set_supply_resistances, phylloptim::Leaf::set_supply_single, phylloptim::Leaf::E_from_Soil_to_Root_Collar]
    reads: [psi_soil, single_resistance, single_gravity_head, kg_per_mol_h2o]
    writes: [E_up_, soil_consumption_, single_psi_soil_]
    kind: closed_form
    note: 'Ohm''s law through one series resistance, with no vulnerability term and no kinks (so its collar derivative never asks for the finite-difference fallback). The one-entry soil_consumption_ holds the molar flux. single_psi_soil_ is the psi_soil driver as this path holds it, seated by set_physiology. The head $h$ is configuration, not derived from a depth (hazard 6); the multi-layer rule for one layer of thickness $d$ is $h = \rho_w g\, d/2$. A zero or non-finite resistance, one below resistance_min (1e-2), or a non-zero $r_{H,\min}$, is refused.'

  # --- the solve -----------------------------------------------------------------
  intercellular_co2:
    section: solve
    title: Intercellular CO₂, where diffusive supply meets demand
    latex: |
      g(c_i) = 10^{-6}\, A(c_i) - \frac{g_c\,(c_a - c_i)}{10^{3}\, P} = 0, \qquad
      c_i \in [\Gamma^* c_P,\; c_a] \ \text{if } A(c_a) \ge 0, \quad
      c_i \in \big[c_a,\; c_a + 2|A(c_a)|\,10^{-6}\, 10^{3} P / g_c\big] \ \text{otherwise}
    code: phylloptim::Leaf::solve_ci
    also: [phylloptim::Leaf::psi_stem_to_ci, phylloptim::Leaf::assim_minus_stom_cond_CO2, phylloptim::Leaf::assim_saturated, phylloptim::Leaf::assim_saturated_kernel]
    reads: [ca, atm_kpa, umol_to_mol, kPa_to_Pa]
    writes: [ci_]
    kind: closed_form
    note: '$A$ in µmol m⁻² s⁻¹ (net, the assimilation entry), $g_c$ in mol m⁻² s⁻¹ (the TOTAL conductance, stomatal_conductance), $c_i$, $c_a$ in Pa, $P$ in kPa. TOMS748 to 1e-13 absolute plus relative in $c_i$. $g$ rises with $c_i$ and is negative at $\Gamma^* c_P$. With $A(c_a) \ge 0$ the root lies in the old bracket; with $A(c_a) < 0$ the leaf is a net source and the root lies ABOVE $c_a$, where the CO₂ it respires leaves through its conductance (#182) -- the upper end is placed where the supply term exceeds the demand''s shortfall. With no conductance at all ($g_\min = 0$ and the stomata shut) the residual degenerates to $A(c_i) = 0$: its root where it has one, which is the $g_\min \to 0$ limit of the shut leaf, and otherwise $c_i = +\infty$ with the leaf netting its saturated assimilation $A(c_i \to \infty)$ (assim_saturated). No $c_i$ is assigned at $c_a$ any more; a solver failure stops.'

  assim_max:
    section: solve
    title: Assimilation with the stomata wide open
    latex: |
      A_\max = A(c_a)
    code: phylloptim::Leaf::set_physiology
    also: [phylloptim::Leaf::prepare_collar_solve]
    reads: [ca]
    writes: [assim_max_]
    kind: closed_form
    note: 'Seated once per set_physiology at the DRIVER temperature, with the energy balance on as well as off (the air-temperature baseline). Its sign says whether the leaf is a sink or a net source at ambient CO₂, which decides which bracket intercellular_co2 solves in; it shuts no leaf (#182).'

  leaf_state_chain:
    section: solve
    title: The operating point at a candidate stem potential
    latex: |
      \psi_\mathrm{stem} \;\to\; E = E(\psi_\mathrm{stem};\psi_\mathrm{up}) \;\to\; T_\mathrm{leaf}(E),\ D_\mathrm{leaf},\ g_\min(T_\mathrm{leaf}) \;\to\; r^* \;\to\; E_s = E - r^* \;\to\; g_c \;\to\; c_i \;\to\; A(c_i)
    code: phylloptim::Leaf::set_leaf_states_rates_from_psi_stem
    also: [phylloptim::Leaf::operating_point_flux]
    reads: [atm_kpa, use_energy_balance_]
    writes: [transpiration_, stom_cond_CO2_, ci_, assim_colimited_, residual_flux_]
    kind: closed_form
    note: 'One forward pass, no iteration and no branch on the flow (#182): $E$ is the hydraulic supply at the candidate potential whatever photosynthesis is doing, zero where the pair is reversed ($\psi_\mathrm{up} \ge \psi_\mathrm{stem}$, potentials being positive magnitudes); with the energy balance on, the temperature block, the deficit and $g_\min$ are re-seated at $T_\mathrm{leaf}(E)$ before $c_i$ is solved. A shut leaf ($E_s = 0$) is the same expressions with the stomatal term zero, so its outputs cannot disagree with the open leaf''s next to it.'

  profit:
    section: solve
    title: The objective at a prescribed potential
    latex: |
      J = h(A) - C(\psi_\mathrm{stem}, \psi_\mathrm{up}), \quad h(A) = A \text{ for a difference curve};
      \qquad \psi_\mathrm{stem} = \mathrm{clamp}_{[\psi_w,\,\psi_\mathrm{crit}]}(\psi) \ \text{(stem route)}, \qquad
      \psi_r = \mathrm{clamp}_{[\psi_a,\,\psi_b]}(\psi) \ \text{(collar route)}
    code: phylloptim::Leaf::profit_psi_stem_for
    also: [phylloptim::Leaf::profit_psi_stem_TF, phylloptim::Leaf::evaluate_psi_stem, phylloptim::Leaf::evaluate_psi_stem_at, phylloptim::Leaf::evaluate_root_collar_psi, phylloptim::Leaf::evaluate_root_collar_psi_for, phylloptim::Leaf::profit_at_collar_psi, phylloptim::Leaf::dry_end]
    reads: [psi_crit]
    writes: [profit_, opt_psi_stem_, opt_root_psi_]
    kind: closed_form
    cite: Wolf-2016
    note: '$A$ is the net assimilation of leaf_state_chain at the operating point and $C$ the seated curve''s cost (the costs section), so $J$ is in µmol m⁻² s⁻¹ for the five difference curves (TF24, CF77, JS22, CMax, TF24_floor). SOX and JW26 report the product $A\,g(\psi)$ (their first-order condition is the log link, $h = \log$) and ProfitMax a normalised profit; those are the costs section''s. Stem route: the upstream potential is $\psi_\mathrm{soil}$, the interval runs from the wet bound $\psi_w$ (wet_bound; $\psi_\mathrm{soil}$ itself at $g_\min = 0$) to $\psi_\mathrm{crit}$, and a wet bound past $\psi_\mathrm{crit}$ leaves it as the one feasible point. Collar route: $[\psi_a, \psi_b]$ is the collar_bracket and $\psi_\mathrm{stem}$ follows by stem_from_collar. Not an optimum: the kind is `prescribed`.'

  foc_stem:
    section: solve
    title: The first-order condition on the stem route
    latex: |
      \frac{dJ}{d\psi_\mathrm{stem}} = h'(A)\, A'(c_i)\, \frac{dc_i}{d\psi_\mathrm{stem}} - \frac{\partial C}{\partial \psi_\mathrm{stem}}, \qquad
      \frac{dc_i}{d\psi_\mathrm{stem}} = \frac{(\partial g_c/\partial \psi_\mathrm{stem})\,(c_a - c_i)/(10^{3} P)}{10^{-6} A'(c_i) + g_c/(10^{3} P)}, \qquad
      \frac{\partial g_c}{\partial \psi_\mathrm{stem}} = \frac{g_c}{E}\, k_{\max} f(\psi_\mathrm{stem});
      \qquad \frac{dJ}{d\psi_\mathrm{stem}} = -\frac{\partial C}{\partial \psi_\mathrm{stem}} \ \text{at } c_i = \Gamma^* c_P
    code: phylloptim::Leaf::dprofit_dpsi_stem
    also: [phylloptim::Leaf::dprofit_dpsi_stem_checked]
    reads: [ca, atm_kpa, umol_to_mol, kPa_to_Pa, leaf_specific_conductance_max, use_energy_balance_]
    writes: []
    kind: derivative
    note: '$dc_i/d\psi$ by the implicit function theorem on the residual of intercellular_co2, so the derivative never passes through the $c_i$ iteration; $A''$ by forward AD of the assimilation kernel. Upstream potential fixed at $\psi_\mathrm{soil}$. Returns (value, feasible): feasible is 0 on the no-flow exit ($\psi_\mathrm{up} \ge \psi_\mathrm{stem}$, a 0.0 sentinel), where nothing conducts at all ($g_\min = 0$ with the stomata shut), and under a log link at a net source ($A \le 0$), where $1/A$ has no derivative. The conductance is the total (stomatal_conductance), formed on $E - r^*$; its slope in $\psi_\mathrm{stem}$ is unchanged, since $r^*$ reads $\psi_\mathrm{stem}$ only through the leaf temperature, which the energy-balance term carries (energy_balance_foc).'

  foc_collar:
    section: solve
    title: The first-order condition on the collar route
    latex: |
      \frac{dJ}{d\psi_r} = h'(A)\, A'(c_i)\, \frac{dc_i}{d\psi_r} - \frac{\partial C}{\partial \psi_\mathrm{stem}} \frac{d\psi_\mathrm{stem}}{d\psi_r} - \frac{\partial C}{\partial \psi_r}, \qquad
      \frac{dc_i}{d\psi_r} = \frac{\big[\frac{\partial g_c}{\partial \psi_\mathrm{stem}} \frac{d\psi_\mathrm{stem}}{d\psi_r} + \frac{\partial g_c}{\partial \psi_r}\big](c_a - c_i)/(10^{3} P)}{10^{-6} A'(c_i) + g_c/(10^{3} P)},
      \qquad \frac{d\psi_\mathrm{stem}}{d\psi_r} = \frac{E_\mathrm{up}'(\psi_r)/k_{\max} + f(\psi_r)}{f(\psi_\mathrm{stem})}, \qquad
      \frac{\partial g_c}{\partial \psi_r} = -\frac{g_c}{E}\, k_{\max} f(\psi_r)
    code: phylloptim::Leaf::dprofit_at_collar_psi
    also: [phylloptim::Leaf::dprofit_droot_collar_psi, phylloptim::Leaf::dprofit_droot_collar_psi_checked]
    reads: [ca, atm_kpa, umol_to_mol, kPa_to_Pa, leaf_specific_conductance_max, use_energy_balance_]
    writes: []
    kind: derivative
    note: 'The collar potential is the decision variable and $\psi_\mathrm{stem}$ follows by continuity (stem_from_collar), whose slope is the second fraction: $E_\mathrm{up}''$ is the soil-to-collar conductance (analytic, with a 1e-6 central difference of the transport at a layer kink). $\partial C/\partial \psi_r$ is non-zero only for a curve whose cost reads the upstream potential (JS22). The same sentinels as the stem route. The residual flux reads the collar through its ceiling, so $\partial g_c/\partial \psi_r$ gains $-\frac{g_c}{E}\,\partial r^*/\partial \psi_r$ (residual_flux), appended; an exact zero at $g_\min = 0$.'

  continuity_root:
    section: solve
    title: Continuity between soil and stem at the collar
    latex: |
      E_\mathrm{col}(\psi_r) = E_\mathrm{up}(\psi_r) - E(\psi_\mathrm{crit};\psi_r) = 0 \ \Rightarrow\ \psi_{r,\mathrm{crit}}, \qquad
      E_\mathrm{up}(\psi_r) = 0 \ \Rightarrow\ \psi_{r,0}, \qquad \psi_r \in [\min_i \psi_{\mathrm{soil},i},\; \psi_\mathrm{crit}]
    code: phylloptim::Leaf::find_root_psi
    also: [phylloptim::Leaf::E_column, phylloptim::Leaf::E_column_zero]
    reads: [psi_crit]
    writes: []
    kind: identity
    note: '$\psi_{r,\mathrm{crit}}$ (collar_at_dry_end) is the collar at which the soil supplies what the stem carries with the stem at its critical potential, the dry end of the bracket; $\psi_{r,0}$ (root_zero_E) the collar at which uptake is zero, the wet end. $E_\mathrm{up}$ and $E$ are the hydraulics section''s, read through their bindings. TOMS748 stops at 1e-4 absolute plus relative: plenty for a bracket, and a bound that turns out to BE the answer is re-solved to 1e-15 first (polish_bracket_bound).'

  stem_from_collar:
    section: solve
    title: The stem potential a collar potential carries
    latex: |
      \psi_\mathrm{stem} = G^{-1}\!\big(E_\mathrm{up}(\psi_r)/k_{\max} + G(\psi_r)\big), \quad G(\psi) = \int_0^{\psi} f(u)\,du
      \quad\Longleftrightarrow\quad E(\psi_\mathrm{stem};\psi_r) = E_\mathrm{up}(\psi_r)
    code: phylloptim::Leaf::find_psi_stem_from_psi_root
    reads: [leaf_specific_conductance_max]
    also: [phylloptim::Leaf::transpiration_to_psi_stem, phylloptim::Leaf::psi_stem_carrying]
    writes: []
    kind: closed_form
    note: 'What the soil delivers to the collar the stem carries to the leaf. $G$ is the stem vulnerability curve''s cumulative integral and $G^{-1}$ its inverse, both the hydraulics section''s; a zero flux past the end of the curve returns the upstream potential. At a dry pin of a curve $\psi_\mathrm{crit}$ does not bound the stem is held at $\psi_\mathrm{end}$ instead (seat_stem_at_dry_pin), which carries the uptake to the continuity root''s precision.'

  collar_bracket:
    section: solve
    title: The feasible collar interval
    latex: |
      [\psi_a, \psi_b] = \big[\psi_a,\ \psi_{r,\mathrm{end}}\big], \quad E_\mathrm{up}(\psi_a) = r^*(\psi_a), \quad E_\mathrm{col}(\psi_{r,\mathrm{end}}; \psi_\mathrm{dry}) = 0;
      \quad \psi_\mathrm{dry} = \psi_\mathrm{crit} \text{ (SOX, JW26, CF77, LeastCost)},\ \psi_\mathrm{end} \text{ otherwise}; \\
      \quad \text{shut if } \min_i \psi_{\mathrm{soil},i} \ge \psi_\mathrm{dry},\ E_\mathrm{col}(\psi_\mathrm{dry}) < r^*,\ \psi_{r,\mathrm{end}} \ge \psi_\mathrm{dry} \text{ or } \psi_b - \psi_a \le \epsilon
    code: phylloptim::Leaf::prepare_collar_solve
    also: [phylloptim::Leaf::dry_end, phylloptim::Leaf::extend_collar_bracket, phylloptim::Leaf::set_shut_state, phylloptim::Leaf::find_wet_bound]
    reads: [psi_crit, collar_root_tol]
    writes: []
    kind: closed_form
    note: 'The dry end is the continuity root with the stem at its dry end: $\psi_\mathrm{crit}$ for the four curves whose own form ends there (cost_domain_ends_at_psi_crit), the end of the stem curve for the rest (#183). The root''s critical potential bounds nothing. For the rest, the optimising solve tries the continuity root at $\psi_\mathrm{crit}$ first, as a bracket that holds the optimum wherever profit already falls there, and extends it (extend_collar_bracket) where it does not. The continuity root is taken from its feasible side. An interval narrower than bracket_tol_at(bound_b) has both ends polished to collar precision, and one no wider than collar_root_tol is a shut-down too; a narrow extension has its dry end polished the same way, its wet end already polished wherever the first bracket was narrow. The wet end is wet_bound and every shut exit is shut_state; nothing shuts a leaf on light or heat (#182).'

  operating_point_kind:
    section: solve
    title: Which condition placed the optimum
    latex: |
      \text{hydraulic-shutdown at the bracket (collar\_bracket, shut\_state); otherwise}\quad
      \text{interior if } J'(\psi_a^+) > 0 > J'(\psi_b), \text{ with } J'(\psi^*) = 0;\quad
      \text{boundary-soil if } J'(\psi_a^+) \le 0;\quad
      \text{boundary-dry if } J'(\psi_b) \ge 0;\quad
      \text{solver-refused if both}
    code: phylloptim::Leaf::maximise_profit_over_collar
    also: [phylloptim::Leaf::OperatingPointKind, phylloptim::Leaf::prepare_collar_solve, phylloptim::Leaf::find_root_collar_psi_for]
    reads: [collar_root_tol, GSS_tol_abs]
    writes: [opt_root_psi_, opt_psi_stem_, profit_]
    kind: identity
    note: 'The collar solve root-finds $J'' = 0$ (foc_collar) to collar_root_tol inside the bracket rather than searching $J$, so a bound that binds has to be detected by the sign of $J''$ at each end: $\psi_a^+$ is the wet end stepped in by 1e-6 of the width (the wet end itself is the no-flow sentinel), $\psi_b$ the dry end. A pinned bound is polished to 1e-15 before it is returned; with a residual conductance the wet bound is a regular point and is returned as the optimum, at $g_\min = 0$ the solve steps 1e-6 of the width inside it. For a curve $\psi_\mathrm{crit}$ does not bound, the dry end is read a step of 1e-6 of the width inside it, where the stem curve still resolves a gradient, and a gradient still rising there pins the leaf at the end of the stem curve: it transpires all the stem can carry. Codes follow the enum: 1 interior, 2 boundary-soil, 3 boundary-dry, 4 hydraulic-shutdown, 5 prescribed, 6 solver-refused, 7 non-finite-gradient. The kind is not bound: operating_point_kind() is C++ only.'

  # --- cost curves and the marginal cost of water --------------------------------
  # --- the cost curves ---------------------------------------------------------
  cost_TF24:
    section: costs
    title: TF24 hydraulic cost
    latex: |
      C_\mathrm{TF24}(\psi) = \gamma\,\big[1 - f(\psi)\big]^{\beta}, \qquad f(\psi) = \exp\!\big[-(\psi/b)^{c}\big]
    code: phylloptim::Leaf::hydraulic_cost_TF
    also: [phylloptim::Leaf::hydraulic_cost_TF_kernel]
    reads: [TF24_cost_scale, TF24_beta2, stem_b, stem_c]
    writes: [hydraulic_cost_]
    kind: closed_form
    cite: Towers-2024
    note: 'Carbon units, a function of the absolute stem potential. Written into `hydraulic_cost_` by the double entry point; the kernel itself is pure so the AD pass of `cost_deriv` cannot write state.'
  cost_CF77:
    section: costs
    title: Cowan–Farquhar cost
    latex: |
      C_\mathrm{CF77} = p\,E, \qquad p = \begin{cases} \lambda_\mathrm{CF} & g_\beta = 0 \\ \lambda_\mathrm{CF} / \min(\beta, 1) & g_\beta = 1 \end{cases}, \qquad \beta = \frac{\theta - \theta_w}{\theta_{fc} - \theta_w}
    code: phylloptim::Leaf::hydraulic_cost_CF77
    also: [phylloptim::Leaf::cf77_price]
    reads: [CF77_lambda_, CF77_soil_beta_]
    writes: [hydraulic_cost_]
    kind: closed_form
    cite: Cowan-1977
    note: '$E$ is the transpiration the supply gives between the two potentials (the hydraulics section). The price $p$ is cf77_soil_price (the soil-moisture section): the bare $\lambda_\mathrm{CF}$ with the gate off, divided by the clamped Medlyn-2011 factor with it on.'
  cost_JS22:
    section: costs
    title: Joshi–Stocker hydraulic term
    latex: |
      C_\mathrm{JS22}(\psi; \psi_u) = \gamma_J\,(\psi - \psi_u)^2
    code: phylloptim::Leaf::hydraulic_cost_JS22
    reads: [JS22_gamma]
    writes: [hydraulic_cost_]
    kind: closed_form
    cite: Joshi-2022
    note: 'Quadratic in the soil-to-leaf DROP, the one cost that reads it rather than the absolute potential; $\psi_u$ is the upstream potential (psi_soil on the stem route, the collar on the collar route). Joshi-2022''s capacity term $\alpha J_{max}$ is not implemented, so this is their hydraulic cost and not their model.'
  cost_CMax:
    section: costs
    title: CMax cost
    latex: |
      C_\mathrm{CMax}(\psi; \psi_u) = \int_{\psi_u}^{\psi} (a\,x + b)\,dx = (\psi - \psi_u)\Big[\tfrac{a}{2}(\psi + \psi_u) + b\Big]
    code: phylloptim::Leaf::hydraulic_cost_CMax
    reads: [CMax_a, CMax_b]
    writes: [hydraulic_cost_]
    kind: closed_form
    cite: Wolf-2016
    note: 'The marginal form $a\psi + b$ is Anderegg-2018''s (as TractLSM implements it); Wolf-2016 asked only for a concave-up cost. Evaluated FACTORED: the difference-of-squares form the vignette table prints is the same function but cancels as the drop closes (1.2e-4 wrong at a 1e-12 drop).'
  cost_TF24_floor:
    section: costs
    title: TF24 with a price floor
    latex: |
      C_\mathrm{TF24f}(\psi; \psi_u) = \gamma\,\big[1 - f(\psi)\big]^{\beta} + \lambda_o\,E
    code: phylloptim::Leaf::hydraulic_cost_TF24_floor
    also: [phylloptim::Leaf::hydraulic_cost_TF_kernel]
    reads: [TF24_cost_scale, TF24_beta2, TF24_floor_lambda_o]
    writes: [hydraulic_cost_]
    kind: closed_form
    note: 'TF24''s own cost at TF24''s own parameters plus a CF77 price, each the parent''s expression in its operand order, so $\lambda_o = 0$ is TF24 and $\gamma = 0$ is CF77 bit for bit.'
  shadow_cost:
    section: costs
    title: The shadow part of the cost
    latex: |
      C_\mathrm{shadow} = \begin{cases} \lambda_o\,E & \text{TF24\_floor} \\ 0 & \text{every other curve} \end{cases}
    code: phylloptim::Leaf::shadow_cost
    reads: [TF24_floor_lambda_o]
    writes: []
    kind: closed_form
    note: 'The part of the cost that is a price rather than a realised carbon loss, at the reported $E$. Zero on the other curves means the curve does not separate the two, not that its cost is all realised carbon (CF77''s whole cost could be read either way).'
  sox_reduction:
    section: costs
    title: SOX reduction factor
    latex: |
      g_\mathrm{SOX}(\psi) = \max\!\left(\frac{f(\psi) - k_\mathrm{crit}}{1 - k_\mathrm{crit}},\; 0\right)
    code: phylloptim::Leaf::sox_reduction
    reads: [k_crit_fraction]
    writes: []
    kind: closed_form
    cite: Eller-2020
    note: '1 at zero tension and exactly 0 at $\psi_\mathrm{crit}$, where $f = k_\mathrm{crit} = 0.05$ by construction, so it takes no parameter. Clamped at zero (Eller-2020 do not): without it a shut-down leaf in the dark ($A = A(c_a) < 0$) past $\psi_\mathrm{crit}$ reports a positive product. Written so a NaN propagates.'
  sox_reduction_deriv:
    section: costs
    title: Slope of the SOX reduction factor
    latex: |
      g_\mathrm{SOX}'(\psi) = -\frac{\lvert f'(\psi)\rvert}{1 - k_\mathrm{crit}}, \qquad \lvert f'\rvert = f\,\frac{c}{b}\Big(\frac{\psi}{b}\Big)^{c-1}
    code: phylloptim::Leaf::sox_reduction_deriv
    reads: [k_crit_fraction, stem_b, stem_c]
    writes: []
    kind: closed_form
    cite: Eller-2020
    note: 'Analytic. Not bound: read through `lambda_SOX` $= -A\,(g''/g)/(k_{max} f)$, inverted with the package''s own $g$, $f$ and $A$ at the same point. Not zeroed past $\psi_\mathrm{crit}$ where $g$ is, which no caller reaches (the objective is zero there).'
  jw26_reduction:
    section: costs
    title: Jones reduction factor
    latex: |
      g_\mathrm{JW}(\psi) = \max\!\left(1 - \frac{\psi}{\psi_\mathrm{crit}},\; 0\right)
    code: phylloptim::Leaf::jw26_reduction
    reads: [psi_crit]
    writes: []
    kind: closed_form
    cite: Jones-2026
    note: 'Linear between the same two anchors as SOX. $\psi_\mathrm{crit}$ is DERIVED (the 95% quantile of the stem curve), where Jones-2026 supply their own $P_\mathrm{crit}$. Clamped at zero past it.'
  jw26_reduction_deriv:
    section: costs
    title: Slope of the Jones reduction factor
    latex: |
      g_\mathrm{JW}'(\psi) = \begin{cases} -1/\psi_\mathrm{crit} & \psi \le \psi_\mathrm{crit} \\ 0 & \psi > \psi_\mathrm{crit} \end{cases}
    code: phylloptim::Leaf::jw26_reduction_deriv
    reads: [psi_crit]
    writes: []
    kind: identity
    cite: Jones-2026
    note: 'Not bound and called by nothing in the solve (only tests/cpp/test_leaf.cpp): `cost_deriv<JW26>` writes the collapsed $-g''/g = 1/(\psi_\mathrm{crit} - \psi)$ directly.'
  leastcost_flux:
    section: costs
    title: Least-cost weighted resource use
    latex: |
      W = \frac{E}{M_w} + \beta_\mathrm{LC}\, V_{cmax} \times 10^{-6}, \qquad C_\mathrm{LC} = \log W
    code: phylloptim::Leaf::leastcost_flux
    reads: [LeastCost_beta, kg_to_mol_h2o, umol_to_mol]
    writes: []
    kind: closed_form
    cite: Prentice-2014
    note: 'mol m⁻² s⁻¹, so $\beta_\mathrm{LC}$ is the published dimensionless $c_V/c_E$. Weighs `vcmax_`, the capacity at the leaf''s temperature, not $V_{c,25}$; Prentice-2014''s $\beta$ carries a viscosity term this package does not model, so this is $\beta/\eta^*$, equal at 25 °C. Not bound: read back from the LeastCost objective, $W = A/J$.'
  profitmax_A_max:
    section: costs
    title: ProfitMax carbon normaliser
    latex: |
      \lvert A\rvert_{\max} = \begin{cases} \max_{\psi \in (\psi_s, \psi_\mathrm{crit}]} A(\psi) & \text{if positive} \\ \max_{\psi} \big[-A(\psi)\big] & \text{otherwise} \end{cases}
    code: phylloptim::Leaf::prepare_profitmax
    also: [phylloptim::Leaf::profitmax_reference_psi]
    reads: [psi_crit]
    writes: []
    kind: identity
    cite: Sperry-2017
    note: 'Found by maximisation (endpoints plus a root-find of $dA/d\psi$), not by Sperry-2017''s scan; the closure point itself, the wet bound where the stomata are shut, is excluded. The maximum can sit at the dry bound (energy balance off, where $A$ rises monotonically) or inside the stream (energy balance on in cold air, where transpiration cooling turns $A$ over). Held constant in the gradient (a partial at fixed normaliser).'
  profitmax_normalisers:
    section: costs
    title: ProfitMax conductance normaliser
    latex: |
      k_s = k_{max}\, f(\psi_s), \qquad k_\mathrm{span} = k_s - k_\mathrm{crit}, \qquad k_\mathrm{crit} = k_{max}\, f(\psi_\mathrm{crit}) = k_\mathrm{crit\,fraction}\; k_{max}
    code: phylloptim::Leaf::prepare_profitmax_norms
    also: [phylloptim::Leaf::profitmax_reference_psi]
    reads: [leaf_specific_conductance_max, psi_crit]
    writes: []
    kind: closed_form
    cite: Sperry-2017
    note: '$k_\mathrm{crit} = 0.05\,k_{max}$ as Sperry-2017 set it, which is the same 0.05 $\psi_\mathrm{crit}$ is derived from. $\psi_s$ is psi_soil on a single soil potential; on a layered profile it is the collar potential at which uptake is zero (the collar bracket''s wet end, not bound). Read through the `profitmax_k_span` accessor.'
  profitmax_objective:
    section: costs
    title: ProfitMax objective
    latex: |
      CG = \frac{A}{\lvert A\rvert_{\max}}, \qquad HC = \frac{k_s - k_{max} f(\psi)}{k_\mathrm{span}}, \qquad TC = \begin{cases} TC(T_\mathrm{leaf}(E)) & g_\mathrm{EB} = 1 \\ TC(T) & g_\mathrm{EB} = 0 \end{cases}, \qquad J = CG - (HC + TC)
    code: phylloptim::Leaf::profit_psi_stem_ProfitMax
    reads: [leaf_specific_conductance_max, use_energy_balance_]
    writes: [carbon_gain_, hydraulic_cost_norm_, thermal_cost_]
    kind: closed_form
    cite: Sperry-2017
    note: 'Sperry-2017''s normalised profit with Sicangco-2026''s thermal cost (zero with use_thermal_cost_ off, constant across the stream with the energy balance off). $CG = 0$ when $|A|_{\max} \le 0$. All three are dimensionless, so `hydraulic_cost_` is not reused.'
  objective:
    section: costs
    title: The objective each curve maximises
    latex: |
      J_K(\psi) = h_K(A) - C_K(\psi) \;\text{in the form}\;
      \begin{cases} A - C_K & \text{TF24, CF77, JS22, CMax, TF24\_floor} \\ A\, g_K(\psi) & \text{SOX, JW26} \;(h = \log,\ C = -\log g) \\ A / W & \text{LeastCost} \;(h = \log,\ C = \log W) \\ CG - (HC + TC) & \text{ProfitMax} \;(h = A/\lvert A\rvert_{\max}) \end{cases}
    code: phylloptim::Leaf::profit_psi_stem_for
    also: [phylloptim::Leaf::benefit_link, phylloptim::Leaf::profit_psi_stem_TF, phylloptim::Leaf::profit_psi_stem_CF77, phylloptim::Leaf::profit_psi_stem_JS22, phylloptim::Leaf::profit_psi_stem_CMax, phylloptim::Leaf::profit_psi_stem_SOX, phylloptim::Leaf::profit_psi_stem_JW26, phylloptim::Leaf::profit_psi_stem_TF24_floor, phylloptim::Leaf::profit_psi_stem_LeastCost, phylloptim::Leaf::profit_psi_stem_ProfitMax]
    reads: []
    writes: []
    kind: closed_form
    note: 'The value `profit_` reports. The product and ratio curves are evaluated in that form, not as $\log A \pm \log(\cdot)$, because at closure $A \le 0$ can hold (a net source, or zero in light at $g_\min = 0$) and the endpoint must stay a candidate; `log` is monotone so the argmax is shared. Only the five difference curves are carbon fluxes; the product, ratio and normalised values must not be compared with them. The product and ratio curves set `hydraulic_cost_` to NA.'
  benefit_link_deriv:
    section: costs
    title: Slope of the benefit link
    latex: |
      h_K'(A) = \begin{cases} 1 & \text{identity: TF24, CF77, JS22, CMax, TF24\_floor} \\ 1/A & \text{log: SOX, JW26, LeastCost} \;(\text{NA if } A \le 0) \\ 1/\lvert A\rvert_{\max} & \text{scaled: ProfitMax} \end{cases}
    code: phylloptim::Leaf::benefit_link_deriv
    also: [phylloptim::Leaf::benefit_link]
    reads: []
    writes: []
    kind: identity
    note: 'The only part of the first-order condition $h''(A)\,A'' - C'' = 0$ that varies by link. Not bound.'
  cost_deriv:
    section: costs
    title: The marginal cost dC/dψ
    latex: |
      C_K'(\psi) = \begin{cases}
      \gamma\beta(1-f)^{\beta-1}\lvert f'\rvert & \text{TF24} \\
      p\, k_{max} f & \text{CF77} \\
      2\gamma_J(\psi - \psi_u) & \text{JS22} \\
      a\psi + b & \text{CMax} \\
      \gamma\beta(1-f)^{\beta-1}\lvert f'\rvert + \lambda_o k_{max} f & \text{TF24\_floor} \\
      -g_\mathrm{SOX}'/g_\mathrm{SOX} & \text{SOX} \\
      1/(\psi_\mathrm{crit} - \psi) & \text{JW26} \\
      k_{max} f / (M_w W) & \text{LeastCost} \\
      k_{max}\lvert f'\rvert / k_\mathrm{span} & \text{ProfitMax}
      \end{cases}
    code: phylloptim::Leaf::cost_deriv
    also: [phylloptim::Leaf::cf77_price, phylloptim::Leaf::hydraulic_cost_TF_kernel, phylloptim::Leaf::leastcost_flux]
    reads: [TF24_cost_scale, TF24_beta2, CF77_lambda_, JS22_gamma, CMax_a, CMax_b, TF24_floor_lambda_o, LeastCost_beta, kg_to_mol_h2o, leaf_specific_conductance_max, stem_b, stem_c, psi_crit]
    writes: []
    kind: identity
    note: 'The one place the cost enters a derivative, shared by both routes. TF24 by forward AD of the cost kernel, the rest analytic. CF77, TF24_floor and LeastCost multiply by $G''(\psi)$, the slope of the integral TABLE the solve runs on, where the printed form has $f$: the two differ by up to 5e-8 relative, the interpolation error of the table, not a defect; the other curves agree to rounding. Off the energy balance; with it on ProfitMax adds $(dTC/dT)(dT/dE)(dE/d\psi)$ in dprofit_energy_balance_term, not here.'
  cost_deriv_upstream:
    section: costs
    title: The marginal cost in the upstream potential
    latex: |
      \frac{\partial C_K}{\partial \psi_u} = \begin{cases}
      -p\, k_{max} f(\psi_u) & \text{CF77} \\
      -2\gamma_J(\psi - \psi_u) & \text{JS22} \\
      -(a\psi_u + b) & \text{CMax} \\
      -\lambda_o k_{max} f(\psi_u) & \text{TF24\_floor} \\
      -k_{max} f(\psi_u) / (M_w W) & \text{LeastCost} \\
      0 & \text{TF24, SOX, JW26, ProfitMax}
      \end{cases}
    code: phylloptim::Leaf::cost_deriv_upstream
    also: [phylloptim::Leaf::cost_reads_upstream, phylloptim::Leaf::cf77_price, phylloptim::Leaf::leastcost_flux]
    reads: [CF77_lambda_, JS22_gamma, CMax_a, CMax_b, TF24_floor_lambda_o, kg_to_mol_h2o, leaf_specific_conductance_max]
    writes: []
    kind: identity
    note: 'On the collar route the upstream potential IS the decision variable, so a cost that reads it moves with the collar directly; a curve missing its row solves the wrong first-order condition silently (#141). The integrand at the lower limit, with $f(\psi_u)$ read through the table slope $G''$ as in cost_deriv. Read off the collar derivative as $h_K'' d_0 - C_K'' s - \partial J_K/\partial\psi_r$, with $s = d\psi/d\psi_r$ recovered from TF24 (which has no upstream term), single-layer and three-layer; the zero rows are the four curves that do not read upstream. Same table-slope floor as cost_deriv.'

  # --- the marginal cost of water -----------------------------------------------
  lambda_TF24:
    section: marginal_cost
    title: TF24 marginal cost of water
    latex: |
      \lambda_\mathrm{TF24}(\psi) = \frac{C'}{E'} = \frac{\gamma\beta\,(c/b)(\psi/b)^{c-1}\,(1-f)^{\beta-1}}{k_{max}}
    code: phylloptim::Leaf::lambda_TF24
    reads: [TF24_cost_scale, TF24_beta2, stem_b, stem_c, leaf_specific_conductance_max]
    writes: []
    kind: closed_form
    cite: Towers-2024
    note: 'µmol C (kg H₂O)⁻¹. The $f$ in $|f''|$ cancels against $dE/d\psi = k_{max} f$ analytically, so it stays finite at $\psi_\mathrm{crit}$; with $\beta < 1$ it diverges as $\psi \to 0$, a property of the cost.'
  lambda_JS22:
    section: marginal_cost
    title: JS22 marginal cost of water
    latex: |
      \lambda_\mathrm{JS22} = \frac{2\gamma_J(\psi - \psi_u)}{k_{max} f(\psi)}
    code: phylloptim::Leaf::lambda_JS22
    reads: [JS22_gamma, leaf_specific_conductance_max]
    writes: []
    kind: closed_form
    cite: Joshi-2022
    note: 'No $f$ cancels, so it divides by $f$, which stays above 0.05 inside the bracket.'
  lambda_CMax:
    section: marginal_cost
    title: CMax marginal cost of water
    latex: |
      \lambda_\mathrm{CMax} = \frac{a\psi + b}{k_{max} f(\psi)}
    code: phylloptim::Leaf::lambda_CMax
    reads: [CMax_a, CMax_b, leaf_specific_conductance_max]
    writes: []
    kind: closed_form
    cite: Anderegg-2018
    note: 'Non-zero at the wet end unless $b = 0$. The upstream potential enters only through $E$, so it is not read.'
  lambda_TF24_floor:
    section: marginal_cost
    title: TF24_floor marginal cost of water
    latex: |
      \lambda_\mathrm{TF24f}(\psi) = \lambda_\mathrm{TF24}(\psi) + \lambda_o
    code: phylloptim::Leaf::lambda_TF24_floor
    also: [phylloptim::Leaf::lambda_TF24]
    reads: [TF24_floor_lambda_o, TF24_cost_scale, TF24_beta2, leaf_specific_conductance_max]
    writes: []
    kind: closed_form
    note: 'The one difference-curve lambda that does not vanish at the wet end. Bit-identical to lambda_TF24 at $\lambda_o = 0$.'
  lambda_SOX:
    section: marginal_cost
    title: SOX marginal cost of water
    latex: |
      \lambda_\mathrm{SOX} = \frac{-A\,(g'/g)}{k_{max} f(\psi)}
    code: phylloptim::Leaf::lambda_SOX
    also: [phylloptim::Leaf::sox_reduction, phylloptim::Leaf::sox_reduction_deriv]
    reads: [leaf_specific_conductance_max]
    writes: []
    kind: closed_form
    cite: Eller-2020
    note: 'Carries a factor of $A$ (a product objective prices water as a share of assimilation) and diverges at $\psi_\mathrm{crit}$. Reads the leaf''s current `assim_colimited_`, so it means what it says only at the potential last evaluated.'
  lambda_JW26:
    section: marginal_cost
    title: JW26 marginal cost of water
    latex: |
      \lambda_\mathrm{JW26} = \frac{A}{(\psi_\mathrm{crit} - \psi)\, k_{max} f(\psi)}
    code: phylloptim::Leaf::lambda_JW26
    reads: [psi_crit, leaf_specific_conductance_max]
    writes: []
    kind: closed_form
    cite: Jones-2026
    note: 'Reads the current `assim_colimited_`, as lambda_SOX does.'
  lambda_ProfitMax:
    section: marginal_cost
    title: ProfitMax marginal cost of water
    latex: |
      \lambda_\mathrm{PM} = \lvert A\rvert_{\max} \left[\frac{\lvert f'\rvert}{f\, k_\mathrm{span}} + \frac{dTC}{dT}\,\frac{dT_\mathrm{leaf}}{dE}\right], \qquad
      \frac{dTC}{dT} = r\,TC\,(1 - TC), \qquad \frac{dT_\mathrm{leaf}}{dE} = -\frac{\lambda_v}{\rho c_p / r_a + g_\mathrm{rad}}
    code: phylloptim::Leaf::lambda_ProfitMax
    also: [phylloptim::Leaf::thermal_cost_temp_deriv]
    reads: [stem_b, stem_c, use_thermal_cost_, use_energy_balance_]
    writes: []
    kind: closed_form
    cite: Sperry-2017
    note: 'Multiplying the normalised objective by $|A|_{\max}$ restores carbon units. The thermal term needs both gates on and is the slope dprofit_energy_balance_term subtracts. NA where $f$, $k_\mathrm{span}$ or $|A|_{\max}$ is not positive. Not bound: read through `lambda_emergent` after a stem-route ProfitMax solve, gates off and both on (a leaf inside the temperature clamp).'
  lambda_LeastCost:
    section: marginal_cost
    title: LeastCost marginal cost of water
    latex: |
      \lambda_\mathrm{LC} = h'(A)^{-1}\,\frac{d\log W}{dE} = \frac{A}{M_w\, W}
    code: phylloptim::Leaf::lambda_LeastCost
    also: [phylloptim::Leaf::leastcost_flux]
    reads: [kg_to_mol_h2o]
    writes: []
    kind: closed_form
    cite: Prentice-2014
    note: 'Eq. S1.4 of the theory manuscript, $c_E A/(c_E E + c_V V_{cmax})$ with $c_E$ cancelled and the kg-to-mol factor supplied. Finite at the wet end, set by the capacity term. Not bound: read through `lambda_emergent` after a stem-route LeastCost solve.'
  lambda_ratio:
    section: marginal_cost
    title: λ is the marginal cost over the marginal water use
    latex: |
      \lambda_K(\psi) = \frac{dC_K/d\psi}{h_K'(A)\; dE/d\psi}
    code: ~
    also: [phylloptim::Leaf::lambda_for]
    reads: []
    writes: []
    kind: derivative
    note: 'The definition every closed form above implements. A lambda read through $E$ agrees with its closed form only to 1.4e-8 to 2.6e-8 relative: $E$ is the integral table, whose slope differs from the closed forms'' $k_{max} f$ by that much (the same table-slope gap as cost_deriv).'
  marginal_cost_water:
    section: marginal_cost
    title: The reported λ
    latex: |
      \lambda = \lambda_\mathrm{TF24}(\psi^*)
    code: phylloptim::Leaf::marginal_cost_water
    also: [phylloptim::Leaf::lambda_TF24]
    reads: []
    writes: []
    kind: closed_form
    note: 'Bound as `lambda`. TF24''s marginal cost at whatever optimum the last solve found, WHICHEVER curve ran, on either route; the seated curve''s own is `lambda_emergent`. Single-layer: on the collar route it omits the series-resistance correction (marginal_cost_water_multilayer).'
  marginal_cost_water_molar:
    section: marginal_cost
    title: λ in molar units
    latex: |
      \lambda_\mathrm{mol} = \lambda \times 10^{-6}\, M_w
    code: phylloptim::Leaf::marginal_cost_water_molar
    reads: [umol_to_mol, kg_to_mol_h2o]
    writes: []
    kind: closed_form
    note: 'mol CO₂ (mol H₂O)⁻¹, the convention the optimality literature states λ in. Bound as `lambda_molar`.'
  marginal_cost_water_multilayer:
    section: marginal_cost
    title: λ with the root-network resistance
    latex: |
      \lambda_\mathrm{multi} = \lambda_\mathrm{TF24}(\psi^*)\left[1 + \frac{k_{max} f(\psi_r)}{S}\right], \qquad S = \frac{dE_\mathrm{up}}{d\psi_r}
    code: phylloptim::Leaf::marginal_cost_water_multilayer
    also: [phylloptim::Leaf::lambda_TF24]
    reads: [leaf_specific_conductance_max]
    writes: []
    kind: derivative
    note: 'TF24''s λ on the collar route: the bracket is $\ge 1$, so the single-layer λ understates the marginal cost. NA where $S$ is unavailable or not positive. Bound as `lambda_multilayer`; it is lambda_emergent on the collar route for TF24 only (lambda_collar).'
  lambda_collar:
    section: marginal_cost
    title: The seated curve's λ on the collar route
    latex: |
      \lambda_{\mathrm{collar},K} = \lambda_{\psi,K}(\psi_s, \psi_r)\left[1 + \frac{k_{max} f(\psi_r)}{S}\right] + \lambda_{E,K} + \frac{1}{S}\frac{\partial C_K}{\partial \psi_r}, \qquad S = \frac{dE_\mathrm{up}}{d\psi_r}
    code: phylloptim::Leaf::lambda_collar_for
    also: [phylloptim::Leaf::marginal_cost_water_multilayer, phylloptim::Leaf::find_root_collar_psi_for, phylloptim::Leaf::profit_at_collar_psi]
    reads: [leaf_specific_conductance_max]
    writes: []
    kind: identity
    note: 'dC/dE along the collar path. $\lambda_\psi$ is the part of a cost that reads $\psi_\mathrm{stem}$ alone (TF24, SOX, JW26, ProfitMax''s conductance term), which takes the series factor; $\lambda_E$ the part that reads the potentials only through E (CF77''s price, LeastCost, the floor''s $\lambda_o$, ProfitMax''s thermal term), which carries over; the last term is the explicit collar read of JS22 and CMax. At an interior optimum the first-order condition makes λ equal $dA/dE$ along the collar path for every link; test_collar_lambda_emergent_is_dA_dE (tests/cpp) asserts it.'
  lambda_emergent:
    section: marginal_cost
    title: The seated curve's λ at its operating point
    latex: |
      \lambda_\mathrm{emergent} = \begin{cases} \lambda_K(\psi^*, \psi_s) & \text{stem route} \\ \lambda_{\mathrm{collar},K} & \text{collar route (lambda\_collar)} \end{cases}, \qquad \lambda_\mathrm{CF77} = p
    code: phylloptim::Leaf::lambda_emergent
    also: [phylloptim::Leaf::lambda_for, phylloptim::Leaf::optimise_psi_stem_single, phylloptim::Leaf::find_root_collar_psi_for]
    reads: []
    writes: []
    kind: closed_form
    note: 'Written by the optimiser that ran; NA before. On the stem route it is the seated curve''s λ (CF77''s is its price, exactly); on the collar route, the same curve''s λ along the collar path (lambda_collar). Until 0.15.4 the collar route reported TF24''s multilayer λ whatever curve was seated.'
  g1_eff:
    section: marginal_cost
    title: Equivalent Medlyn slope
    latex: |
      g_{1,\mathrm{eff}} = \frac{\chi\sqrt{D_\mathrm{leaf}}}{1 - \chi}, \qquad \chi = c_i / c_a
    code: phylloptim::Leaf::g1_eff
    reads: [ca]
    writes: []
    kind: closed_form
    cite: Medlyn-2011
    note: 'kPa^0.5, by inverting the USO relation $\chi = g_1/(g_1 + \sqrt{D})$ at the solved $\chi$: operational, not predicted from λ. Comparable with Lin-2015''s fitted values, which use a diffusion ratio of 1.6 where this package uses 1.67. NA for $\chi \ge 1$ or non-finite. Reads the leaf deficit, so it moves with the energy balance.'
  stom_cond_H2O:
    section: marginal_cost
    title: Stomatal conductance to water vapour
    latex: |
      g_{s,\mathrm{H_2O}} = 1.67\, \hat g_c
    code: phylloptim::Leaf::stom_cond_H2O
    also: [phylloptim::Leaf::boundary_layer_co2_excess]
    reads: [H2O_CO2_stom_diff_ratio_, use_energy_balance_]
    writes: []
    kind: closed_form
    note: 'mol H₂O m⁻² s⁻¹ (#56); bound as `gs_H2O`. The ratio is the settable diffusion ratio. The total leaf-to-air conductance: with the energy balance on, $\hat g_c$ is recovered from the stored $g_c$ as $g_c / (1 + k g_c)$ (boundary_layer_co2_split).'

  # --- Medlyn route, soil moisture and the closed form ---------------------------
  # --- medlyn -------------------------------------------------------------------
  medlyn_beta:
    section: medlyn
    title: Medlyn soil-moisture factor
    latex: |
      \beta = \mathrm{clamp}_{[0,\,1]}\!\left(\frac{\theta - \theta_w}{\theta_{fc} - \theta_w}\right)
    code: phylloptim::Leaf::medlyn_beta
    reads: [theta, theta_fc, theta_w]
    writes: []
    kind: closed_form
    note: 'Both Medlyn routes multiply g1 by it. Clamped, so a soil wetter than field capacity is field capacity and one drier than the wilting point is the wilting point. The one clamp the leaf keeps on a modelled quantity, because it is the published form of the soil-moisture factor (the corner at $\theta_w$ and $\theta_{fc}$ is the model, not a guard); CF77''s soil price clamps the same factor at 1 for the same reason. Not bound: read back through medlyn_model_gs at g0 = 0.'
  medlyn_gs:
    section: medlyn
    title: Medlyn stomatal conductance, on the CO₂ basis
    latex: |
      g_s = \frac{1}{1.6}\left[g_0 + 1.6\left(1 + \frac{g_1\,\beta}{\sqrt{D_\mathrm{air}}}\right)\frac{A}{c_a / c_P}\right], \qquad g_s = g_0/1.6 \text{ at } D_\mathrm{air} = 0
    code: phylloptim::Leaf::medlyn_model_gs
    also: [phylloptim::Leaf::medlyn_beta]
    reads: [g0, g1, medlyn_ratio, atm_vpd, ca, atm_kpa]
    writes: [medlyn_model_gs_]
    kind: closed_form
    cite: Medlyn-2011
    note: 'Medlyn-2011 eq. 11, the USO form, which is a water-vapour conductance; divided by its 1.6 to the CO₂ basis every other conductance in the leaf is on (#129), so that $A = g_s (c_a - c_i)$ holds for this route too. $c_a$ converted from Pa to µmol mol⁻¹, and $\beta$ on $g_1$, which is the code''s and not the paper''s.'
  medlyn_ci_numerical:
    section: medlyn
    title: Medlyn operating point by root-finding
    latex: |
      r(c_i) = g_s\big(A(c_i)\big)\,(c_a - c_i) - A(c_i)\,\frac{10^{3} P}{10^{6}}, \qquad
      c_i:\ r(c_i) = 0 \text{ on } [\arg\max r,\ c_a]; \qquad g_s < 0 \Rightarrow g_s = 0,\ c_i = \Gamma^* c_P,\ A = -R_d
    code: phylloptim::Leaf::solve_medlyn_ci_numerical
    also: [phylloptim::Leaf::medlyn_stom_cond_minus_coupled_stom_cond, phylloptim::Leaf::set_medlyn_shutdown_if_closed]
    reads: [atm_kpa, ca, kPa_to_Pa]
    writes: [ci_, assim_colimited_, stom_cond_CO2_]
    kind: identity
    note: 'Supply equals demand on the CO₂ basis, with both sides multiplied by $(c_a - c_i)$ so the residual stays finite at $c_a$. Brent maximisation of $r$ on $[\Gamma^* c_P, c_a]$, then a root-find from the maximum. Where no root exists ($r \le 0$ everywhere) the closest approach is taken, and a negative conductance there collapses to the closed state, as the optimality routes'' shutdown exits do.'
  medlyn_ci_analytical:
    section: medlyn
    title: Medlyn operating point, closed form
    latex: |
      c_i = c_a\,\frac{g_1 \beta}{g_1 \beta + \sqrt{D_\mathrm{air}}}
    code: phylloptim::Leaf::solve_medlyn_ci_analytical
    also: [phylloptim::Leaf::medlyn_beta, phylloptim::Leaf::set_medlyn_shutdown_if_closed]
    reads: [g1, atm_vpd, ca]
    writes: [ci_, assim_colimited_, stom_cond_CO2_]
    kind: closed_form
    cite: Medlyn-2011
    note: 'Medlyn-2011 eq. 13 with $\beta$ on $g_1$. The same model as the numerical route in the limit $g_0 \to 0$, where it is that route''s root exactly; at the default $g_0$ it drops the $g_0$ term, so its $g_s$ and $c_i$ are mutually consistent only in that limit. Its conductance is the USO form at this $c_i$, on the CO₂ basis.'
  soil_moisture_state:
    section: soil_moisture
    title: Soil-moisture working copies
    latex: |
      \tilde\theta \leftarrow \theta, \qquad \tilde\theta_{fc} \leftarrow \theta_{fc}, \qquad \tilde\theta_w \leftarrow \theta_w
    code: phylloptim::Leaf::set_physiology
    reads: [theta, theta_fc, theta_w]
    writes: [theta_, theta_fc_, theta_w_]
    kind: closed_form
    note: 'The tilde marks the working copies `theta_`, `theta_fc_`, `theta_w_`. Every set_physiology overwrites the trailing-underscore working copies from the inputs, so a working copy written directly is undone by the next set_drivers(). Both readers, medlyn_model_gs and cf77_price, read the working copies only; the root-water compute path reads none of them.'
  cf77_soil_price:
    section: soil_moisture
    title: CF77 price of water with the soil-moisture factor
    latex: |
      \lambda_\mathrm{eff} = \begin{cases} \lambda & g_\beta = 0 \\
      \lambda / \min(\beta, 1) & g_\beta = 1,\ \beta > 0 \end{cases}, \qquad
      \beta = \frac{\theta - \theta_w}{\theta_{fc} - \theta_w}
    code: phylloptim::Leaf::cf77_price
    also: [phylloptim::Leaf::check_cost_parameters]
    reads: [CF77_soil_beta_, CF77_lambda_, theta, theta_fc, theta_w]
    writes: []
    kind: closed_form
    note: 'The same $\beta$ as medlyn_gs but CLAMPED at 1, so at and above field capacity the price is plain CF77 exactly and $\lambda$ is a floor. With the gate on, a solve refuses $\theta_{fc} \le \theta_w$ and $\beta \le 0$ (a price at infinity or below zero). Readable as `lambda_emergent` after an exact CF77 stem solve, which is `lambda_for<CF77>` = this price.'

  # --- closed form ----------------------------------------------------------------
  uso_group:
    section: closed_form
    title: The USO group
    latex: |
      Q = \frac{3\,\Gamma^* c_P / M_w}{r_{wc} \times 10^{-3}}, \qquad \xi = \sqrt{Q/\lambda}, \qquad
      \frac{c_i}{c_a} = \frac{\xi}{\xi + \sqrt{D_\mathrm{leaf}}}
    code: phylloptim::closed_form::uso_group
    also: [phylloptim::closed_form::evaluate_at_lambda]
    reads: [atm_kpa, kg_to_mol_h2o, H2O_CO2_stom_diff_ratio_]
    writes: []
    kind: closed_form
    cite: Medlyn-2011
    note: 'Converts a marginal cost of water (µmol C per kg H₂O) into the USO slope $\xi$. The $3\Gamma^*$ is the electron-transport-limited $dA/dc_i$, so the collapse is an approximation under Rubisco-bound colimitation, at high temperature or low $c_i$. Not bound and its result is never reported.'
  transpiration_from_assim:
    section: closed_form
    title: Demand-side transpiration
    latex: |
      E = \frac{r_{wc} \times 10^{-3}\, A\, D_\mathrm{leaf}}{(c_a - c_i)/M_w}
    code: phylloptim::closed_form::transpiration_from_assim
    reads: [kg_to_mol_h2o, H2O_CO2_stom_diff_ratio_]
    writes: []
    kind: closed_form
    note: 'Fick''s law inverted for $E$ (kg m⁻² s⁻¹) given $A$ and $c_i$; the 1e-3 carries $P$ = $10^{3}$ Pa per kPa against $c_a$ in Pa, so it is exact only with $P$ cancelling, which it does on this path. Not bound.'
  stom_cond_from_E:
    section: closed_form
    title: Conductance from transpiration
    latex: |
      g_c = \frac{P\, E / M_w}{D_\mathrm{leaf}\, r_{wc}}
    code: phylloptim::closed_form::stom_cond_from_E
    also: [phylloptim::Leaf::stom_cond_CO2]
    reads: [atm_kpa, kg_to_mol_h2o, H2O_CO2_stom_diff_ratio_]
    writes: []
    kind: closed_form
    note: 'UNREACHABLE from R: optimise_into keeps only the solution''s $\psi$, so this value is dropped. It is the same expression as Leaf::stom_cond_CO2 (stomatal_conductance).'
  dassim_dci:
    section: closed_form
    title: Slope of the colimited assimilation
    latex: |
      \frac{dA}{dc_i} = \frac{1}{2\theta}\left[s' - \frac{2 s s' - 4\theta (W_c' W_j + W_c W_j')}{2\sqrt{s^2 - 4\theta W_c W_j}}\right],\quad
      s = W_c + W_j,\ W_c' = \frac{V_{cmax}(K_m + \Gamma^* c_P)}{(c_i + K_m)^2},\ W_j' = \frac{J}{4}\frac{3\,\Gamma^* c_P}{(c_i + 2\Gamma^* c_P)^2}
    code: phylloptim::closed_form::dassim_dci
    reads: [curv_fact_colim, atm_kpa]
    writes: []
    kind: derivative
    note: 'Analytic derivative of the assimilation quadratic, used by the Newton step. Not bound.'
  dlambda_TF24:
    section: closed_form
    title: Slope of TF24's marginal cost
    latex: |
      \frac{d\lambda}{d\psi} = \frac{K}{b}\,p^{c-2}\Big[(\beta_2 - 1)(1 - f)^{\beta_2 - 2} f\, c\, p^{c} + (1 - f)^{\beta_2 - 1}(c - 1)\Big],\quad
      K = \frac{s\,\beta_2\,c}{b\,k_{max}},\ p = \psi/b,\ f = e^{-p^c}
    code: phylloptim::closed_form::dlambda_TF24
    reads: [TF24_cost_scale, TF24_beta2, stem_c, stem_b, leaf_specific_conductance_max]
    writes: []
    kind: derivative
    note: 'Analytic $d\lambda/d\psi$ of Leaf::lambda_TF24, used by the TF24 and TF24_floor Newton steps (the floor''s constant differentiates away). Not bound.'
  psi_from_supply:
    section: closed_form
    title: Stem potential from a demanded transpiration
    latex: |
      \psi^* = \begin{cases} \psi_\mathrm{up} & E \le 0 \\ \psi_\mathrm{crit} & E \ge E(\psi_\mathrm{crit}) \\
      G^{-1}\!\big(E/k_{max} + G(\psi_\mathrm{up})\big) & \text{otherwise} \end{cases}
    code: phylloptim::closed_form::psi_from_supply
    reads: [psi_crit]
    writes: []
    kind: closed_form
    note: 'NOT $E/k_{max}$: $G$ is the cumulative vulnerability integral, so the inversion is the supply table''s (transpiration_to_psi_stem and transpiration). On the stem route $\psi_\mathrm{up}$ is $\psi_\mathrm{soil}$. Not bound. Both clamped branches return a bound potential, which within_guard always rejects (dark leaf, $E < 0$; a low price, $E \ge E(\psi_\mathrm{crit})$).'
  evaluate_at_lambda:
    section: closed_form
    title: Operating point at a marginal cost
    latex: |
      \xi = \sqrt{Q/\lambda}, \quad c_i = \frac{c_a\,\xi}{\xi + \sqrt{D_\mathrm{leaf}}}, \quad A = A(c_i), \quad E = E(A, c_i), \quad g_c = g_c(E)
    code: phylloptim::closed_form::evaluate_at_lambda
    also: [phylloptim::closed_form::evaluate_at]
    reads: []
    writes: []
    kind: closed_form
    note: 'Assembles the closed form''s solution at the final potential (TF24 and TF24_floor arms; CF77 inlines the same lines). Its $\psi$ is passed through and its $c_i$, $A$ reach only within_guard; the reported `ci_`, `assim_colimited_` and `transpiration_` are the EXACT state at $\psi^*$, not these USO estimates.'
  wet_end_p:
    section: closed_form
    title: Wet-end starting potential
    latex: |
      (p - p_\mathrm{up})\,p^{n/2} = C, \quad n = c\,\beta_2 - 1, \quad
      p_0 = C^{2/(n+2)}\ \text{at}\ p_\mathrm{up} = 0, \text{ else four Newton steps from } p_\mathrm{up} + p_0
    code: phylloptim::closed_form::wet_end_p
    reads: []
    writes: []
    kind: closed_form
    note: 'A dark leaf gives $C < 0$ and a NaN start, which the guard then rejects. Power-law demand against a supply linearised at the wet end, in units of $b$; each step is clamped strictly inside $(p_\mathrm{up}, p_\mathrm{crit})$. Pure arithmetic on its arguments, so it references no parameter. Not bound.'
  closed_form_TF24:
    section: closed_form
    title: Closed form for TF24
    latex: |
      \psi_0 = b\,p(C),\ C = \frac{\kappa \sqrt{D}\,\Xi}{k_{max} b},\ \kappa = \frac{r_{wc} 10^{-3} A(c_a)}{c_a / M_w},\ \Xi = \sqrt{Q b k_{max} / (s \beta_2 c)};\quad
      \psi_1 = \psi_0 - \frac{E_\mathrm{supply}(\psi_0) - E(\psi_0)}{k_{max} f(\psi_0) - dE/d\psi};\quad
      \beta_2 = 1/c:\ \xi = \Xi,\ \psi^* = \psi(E)
    code: phylloptim::closed_form::solve
    also: [phylloptim::closed_form::solve_exact_beta2, phylloptim::closed_form::beta2_is_exact]
    reads: [TF24_cost_scale, TF24_beta2, stem_c, stem_b, leaf_specific_conductance_max, psi_crit, H2O_CO2_stom_diff_ratio_, kg_to_mol_h2o]
    writes: []
    kind: closed_form
    note: 'Leading order from the wet-end power law, then ONE Newton step on supply minus demand (two are worse in the tail); at $\beta_2 = 1/c$ (to 1e-12) $\lambda$ is constant and only the supply inversion remains. $\lambda(\psi)$ and the supply are lambda_TF24, transpiration and transpiration_to_psi_stem. Prescribed temperature only (#121).'
  closed_form_CF77:
    section: closed_form
    title: Closed form for CF77
    latex: |
      \xi = \sqrt{Q/\lambda_\mathrm{eff}}, \quad c_i = \frac{c_a\,\xi}{\xi + \sqrt{D_\mathrm{leaf}}}, \quad
      E = E\big(A(c_i), c_i\big), \quad \psi^* = \psi(E)
    code: phylloptim::closed_form::solve_CF77
    also: [phylloptim::Leaf::cf77_price]
    reads: [CF77_lambda_, CF77_soil_beta_]
    writes: []
    kind: closed_form
    cite: Cowan-1977
    note: 'The $n = 0$ case: $\lambda$ is the CF77 price (with the soil factor when gated), so there is no iteration. "No iteration" is not "exact": the USO collapse''s $3\Gamma^*$ remains, and the guard serves rows with $\psi^*$ off the exact optimum by up to 24% (header table).'
  closed_form_TF24_floor:
    section: closed_form
    title: Closed form for TF24_floor
    latex: |
      \psi_0 = \min\!\big(\psi(E)|_{\lambda = \lambda_o},\ \psi_\mathrm{crit}(1 - 10^{-9})\big), \quad
      \psi_1 = \psi_0 - \frac{E_\mathrm{supply}(\psi_0) - E(\psi_0)}{k_{max} f(\psi_0) - dE/d\psi}, \quad \lambda = \lambda_\mathrm{TF24} + \lambda_o
    code: phylloptim::closed_form::solve_TF24_floor
    reads: [TF24_floor_lambda_o, psi_crit, leaf_specific_conductance_max, H2O_CO2_stom_diff_ratio_, kg_to_mol_h2o]
    writes: []
    kind: closed_form
    note: 'Leading order is CF77''s at the price $\lambda_o$ (the lowest this curve charges, so the start is too dry), then one Newton step restoring the TF24 term; $d\lambda/d\psi$ is TF24''s. At the default cost scale the guard serves rows up to 52% off the exact $\psi^*$ (header table). $\lambda(\psi)$, $f(\psi)$ and the supply are lambda_TF24_floor, proportion_of_conductivity, transpiration and transpiration_to_psi_stem.'
  within_guard:
    section: closed_form
    title: The validity guard
    latex: |
      \text{serve} \iff \text{finite}(\psi^*, c_i, A) \ \wedge\ c_i/c_a > 0.5 \ \wedge\ \psi_\mathrm{soil} < \psi^* < \psi_\mathrm{crit}
    code: phylloptim::closed_form::within_guard
    reads: [psi_crit, ca]
    writes: []
    kind: closed_form
    note: 'Tests the closed form''s OWN output (its USO $c_i$, not the reported `ci_`), so it is applied after solving, with a fall-back to the whole exact solve that `closed_form_fallbacks_` counts. It guards the expansion, not the model: true never means "right". Its verdict is reported as `last_solve_fell_back_`.'
  optimise_closed:
    section: closed_form
    title: Dispatch and refusals of the closed form
    latex: |
      \text{refuse if collar route} \vee n_\mathrm{layers} > 1 \vee g_\mathrm{EB} \vee g_\mathrm{TD} \vee \text{curve} \notin \{\mathrm{TF24}, \mathrm{CF77}, \mathrm{TF24\_floor}\} \vee (\mathrm{TF24\_floor} \wedge \lambda_o \le 0);\quad
      \psi_\mathrm{soil} > \psi_\mathrm{crit} \Rightarrow \psi^* = \psi_\mathrm{soil}
    code: phylloptim::Leaf::optimise_closed
    also: [phylloptim::closed_form::optimise_into, phylloptim::closed_form::require_prescribed_temperature]
    reads: [use_energy_balance_, use_thermal_damage_, TF24_floor_lambda_o]
    writes: [opt_psi_stem_, last_solve_fell_back_, closed_form_calls_, closed_form_fallbacks_]
    kind: closed_form
    note: 'Reached with set_model(curve, "stem", "closed") then optimise(). Every refusal is a stop at solve time, never a NaN (a NaN would read as "fall back" and hide the cause). Only $\psi^*$ comes from the closed form; every other output is written by the exact solve''s own assembly at that $\psi^*$. JS22, CMax and ProfitMax are refused as unimplemented (the inversion exists), SOX, JW26 and LeastCost as impossible (log benefit link).'
