  Tcrit_:
    section: biochemistry
    symbol: 'T_\mathrm{crit}'
    units: '°C'
    class: hyperparameter
    meaning: 'onset temperature of the thermal cost; $r = 2/(T_{50} - T_\mathrm{crit})$, as the authors'' code computes it and not as their Eqn 8 prints it'
    source: Sicangco-2026 Table 2
    cite: Sicangco-2026
    placeholder: false
    code: phylloptim::Leaf::Tcrit_

  # --- respiration ------------------------------------------------------------
  R_d_25:
