# RcppR6 bindings for phylloptim::Leaf (issue #5, stage 1).
#
# PROVENANCE. This is plant's `inst/RcppR6_classes.yml` Leaf block, moved here
# and adjusted, not written fresh -- that is deliberate. plant's version is the
# reference implementation: it is the surface that plant's `test-leaf.r` has been
# exercising for years, so translating it rather than redesigning it means a
# failure in this stage is a translation error and nothing else. The redesign is
# stage 2, in a thin R layer above this file, where it can be rewritten without
# touching the build.
#
# Four differences from plant's copy, all forced:
#
#   * `name_cpp: phylloptim::Leaf`, not `plant::Leaf`.
#   * The constructor's R-side argument names are the real C++ ones. plant still
#     says `c`, `b` and `g1_TF24` positionally; #15 renamed those to `stem_c`,
#     `stem_b` and `TF24_cost_scale`, and the whole reason 10a had to land before
#     this item is that an R name is much harder to change than a C++ one. `c` is
#     also the name of a base R function, which is its own small argument.
#   * The four fields #15 deleted are gone: `rho_`, `a_bio_`, `area_leaf_` and
#     `sapwood_volume_per_leaf_area_`.
#   * `root_collar_psi_` is `opt_root_psi_`, positive (#25). A flipped sign under
#     the old name would let an old script silently read the wrong number; a
#     rename gives an error, which is the point of having renamed it.
#
# HAZARD, carried from plant's guide: for `access: field` the generator pastes
# `name_cpp` verbatim after `->`, so a dotted path reaches a member that has been
# moved into a sub-object without the R-side name moving. That is how the
# `roots_.` entries below work, and it is what makes a future member move cheap.

# The per-layer root hydraulic resistances `set_physiology` takes (#33). A `list:`
# class rather than an R6 one: it is a value, not a stateful object, and the
# generated Rcpp::as/wrap is what lets it be a set_physiology ARGUMENT at all.
#
# Two of the five fields drive the solve -- r_R_H_min and r_R_V_sum. The other
# three are diagnostics the model never reads; they are carried because plant
# exposes them, and they are removal candidates with item 6. A network built by
# hand can leave them empty.
RootNetwork:
  name_cpp: "phylloptim::RootNetwork"
  roxygen: |
    Root hydraulic resistances, per layer and per unit leaf area

    What `set_physiology()` takes in place of a root carbon profile (#33). Which
    root-architecture model turned carbon into these resistances is not this
    package's business, exactly as which conductance-versus-height model produced
    `leaf_specific_conductance_max` never was. If you do have a carbon profile,
    [root_network_from_carbon()] is the model that used to run inside the leaf.

    `r_R_H_min` and `r_R_V_sum` are the two fields the solve reads. Their common
    length is the number of ROOTED layers, which may be fewer than the number of
    soil layers but never more. `c_r_V`, `c_r_H` and `r_R_V` are diagnostics and
    may be left empty.

    @title Root resistance network
    @param ...,values Values to initialise the struct with (either as
    variadic arguments, or as a list, but not both).
    @export
  list:
    - r_R_H_min: "std::vector<double>"
    - r_R_V_sum: "std::vector<double>"
    - c_r_V: "std::vector<double>"
    - c_r_H: "std::vector<double>"
    - r_R_V: "std::vector<double>"

Leaf:
  name_cpp: "phylloptim::Leaf"
  constructor:
    roxygen: |
      Leaf-level gas exchange with explicit hydraulics.

      Stomatal behaviour emerges from a gain-risk profit maximisation over the
      root-collar water potential rather than from an empirical conductance
      model, coupled to Farquhar-von Caemmerer-Berry photosynthesis and an
      explicit soil-root-stem-leaf water transport path. See the package README
      for the model and for how it differs from `plantecophys`, `tealeaves` and
      `bigleaf`.

      Set the drivers with `$set_physiology()`, solve with `$optimise()`, then
      read the operating point off the object: `$opt_psi_stem_`, `$profit_`,
      `$assim_colimited_`, `$transpiration_`, `$lambda`, `$g1_eff`.
      `$find_root_collar_psi()` is the same solve under the default model, kept
      because that is what `plant`'s own sources spell.

      **Which model is configuration, not a call argument.** `$set_model(curve,
      route)` seats it and `$optimise()` takes nothing, because the curves'
      constants already live on the object -- `$CF77_lambda_` is a field, and
      `JS22_gamma`, `CMax_a` and `CMax_b` are traits. `curve` is any name from
      [cost_curve_names()]; `route` is `"collar"` (the full soil-to-collar path,
      any supply) or `"stem"` (psi_stem with the upstream potential pinned at
      `psi_soil`, single soil layer only). A third argument, `method`, chooses HOW
      the operating point is reached: `"exact"` (the default, a root-find of the
      first-order condition) or `"closed"` (the closed form, for `TF24` and `CF77`
      on the stem route only). `$model_curve()`, `$model_route()` and
      `$model_method()` report what is seated. The defaults are `"TF24"`,
      `"collar"` and `"exact"`, which is the production path.

      ```r
      l$set_model("ProfitMax", "stem")
      l$optimise()
      ```

      `ProfitMax` writes `$carbon_gain_`, `$hydraulic_cost_norm_` and
      `$thermal_cost_`, which are unitless and are NOT the same quantities as
      `$hydraulic_cost_`; `$profitmax_curve()` returns its whole cost, gain and
      profit curve in one call.

      ⚠️ **`$profit_` carries three kinds of number across the seven curves** --
      carbon for the four difference objectives, a dimensionless normalised
      profit for `ProfitMax`, and carbon times a dimensionless factor for the two
      products. Comparing it BETWEEN curves is not meaningful; comparing each
      curve's argmax is.

      All water potentials are **positive magnitudes in MPa**. There is one
      representation throughout and it is asserted, not documented: a negative
      `stem_P50` or `root_P50` is an error here, and a negative `psi_soil` is an
      error in `set_physiology`.

      @param vcmax_25 maximum carboxylation rate at 25 C (umol m^-2 s^-1)
      @param stem_c shape parameter of the STEM hydraulic vulnerability curve (unitless)
      @param stem_P50 STEM potential at 50% loss of hydraulic conductivity (MPa, positive magnitude)
      @param root_c shape parameter of the ROOT hydraulic vulnerability curve (unitless)
      @param root_P50 ROOT potential at 50% loss of hydraulic conductivity (MPa, positive magnitude)
      @param TF24_beta2 exponent for the effect of hydraulic risk (unitless)
      @param jmax_25 maximum rate of electron transport at 25 C (umol m^-2 s^-1)
      @param a quantum yield of photosynthetic electron transport (mol mol^-1)
      @param curv_fact_elec_trans curvature factor for the light response curve (unitless)
      @param curv_fact_colim curvature factor for the colimited photosynthesis equation
      @param GSS_tol_abs absolute tolerance for the collar route's golden-section
        FALLBACK, and for the width below which it treats the feasible collar
        interval as a single point. ⚠️ It does NOT set how well the operating
        point is determined -- the collar solve root-finds its own first-order
        condition -- and it does NOT reach the stem route at all.
      @param vulnerability_curve_ncontrol number of control points for the pre-computed vulnerability curves
      @param ci_abs_tol absolute tolerance for root-solving ci
      @param ci_niter maximum number of iterations for root-solving ci
      @param TF24_cost_scale cost parameter for the TF24 profit model (umol m^-2 s^-1)

      @export
    args:
      - vcmax_25: double
      - stem_c: double
      - stem_P50: double
      - root_c: double
      - root_P50: double
      - TF24_beta2: double
      - jmax_25: double
      - a: double
      - curv_fact_elec_trans: double
      - curv_fact_colim: double
      - GSS_tol_abs: double
      - vulnerability_curve_ncontrol: double
      - ci_abs_tol: double
      - ci_niter: double
      - TF24_cost_scale: double

  active:
    # --- the traits, READ-ONLY (#95) ------------------------------------------
    #
    # They were `set_traits()` arguments and nothing else, so from R they could be
    # written and not read. That is fine while a caller only ever sets them, and
    # stops being fine the moment anything has to compute a quantity the model
    # defines in terms of one. The case that raised it: Sperry's hydraulic cost
    # normalises by `k(psi_soil) - k_crit`, and `k_crit = kmax *
    # proportion_of_conductivity(psi_crit)` -- both of those are bound, so the only
    # missing piece was `psi_crit`, and a probe script in
    # a downstream replication study carried a hard-coded 5.870283 for it.
    #
    # ⚠️ READ-ONLY, and that is hazard 10 rather than caution: changing a trait
    # means rebuilding up to two vulnerability splines and clearing the solved
    # operating point, so `set_traits()` is still the only way to move one. These
    # exist so a caller can read back what they set. RcppR6 makes an
    # `access: field` binding read-only exactly when `readonly: true` is given --
    # the same mechanism the three `single_*` fields below use.
    #
    # `R_d_25` is NOT here because it is already bound, and settable, further down:
    # plant's own bindings pin the generated constructor by arity, so `leaf_model()`
    # has to apply it after construction.
    vcmax_25: {type: double, access: field, readonly: true}
    jmax_25: {type: double, access: field, readonly: true}
    stem_c: {type: double, access: field, readonly: true}
    stem_P50: {type: double, access: field, readonly: true}
    root_c: {type: double, access: field, readonly: true, name_cpp: "roots_.root_c"}
    root_P50: {type: double, access: field, readonly: true, name_cpp: "roots_.root_P50"}
    # DERIVED from the (P50, c) pair above, and bound because callers need to read
    # them: `stem_b` is the curve's scale and `psi_crit` its 5%-conductivity
    # quantile, which is also Sperry's reference potential.
    stem_b: {type: double, access: field, readonly: true}
    psi_crit: {type: double, access: field, readonly: true}
    root_b: {type: double, access: field, readonly: true, name_cpp: "roots_.root_b"}
    root_psi_crit: {type: double, access: field, readonly: true, name_cpp: "roots_.root_psi_crit"}
    TF24_beta2: {type: double, access: field, readonly: true}
    # `a` reads badly as a field name and stays `a` anyway: it is what `set_traits()`
    # and `leaf_traits()` call the quantum yield, and a read whose name differs from
    # the write's cannot be round-tripped by a caller iterating over trait names.
    a: {type: double, access: field, readonly: true}
    curv_fact_elec_trans: {type: double, access: field, readonly: true}
    curv_fact_colim: {type: double, access: field, readonly: true}
    TF24_cost_scale: {type: double, access: field, readonly: true}

    # --- solved operating point ----------------------------------------------
    ci_: {type: double, access: field}
    stom_cond_CO2_: {type: double, access: field}
    assim_colimited_: {type: double, access: field}
    transpiration_: {type: double, access: field}
    soil_consumption_: {type: "std::vector<double>", access: field}
    profit_: {type: double, access: field}
    psi_stem: {type: double, access: field}
    CF77_lambda_: {type: double, access: field}
    # Turns the Medlyn (2011) soil-moisture factor on for the CF77 price, so the
    # marginal value of water becomes `CF77_lambda_ / beta(theta_)` instead of the
    # bare constant. Default FALSE, and false is bit-identical to the constant.
    #
    # It exists because Cowan-Farquhar is the one curve here whose PRICE of water
    # does not respond to soil state -- soil reaches its optimum only through the
    # feasible bracket -- so it has no soil-moisture shutdown. Set `theta_`,
    # `theta_w_` and `theta_fc_` (all fields) to drive it. beta is clamped at 1, so
    # at any `theta_ >= theta_fc_` this is plain CF77 exactly.
    CF77_soil_beta_: {type: bool, access: field}
    # --- soil-moisture inputs for the Medlyn beta factor ----------------------
    # ⚠️ SET THESE, NOT the trailing-underscore ones. `theta_`, `theta_fc_` and
    # `theta_w_` below are WORKING COPIES: set_physiology overwrites all three from
    # these on every driver set, so a bare `l$theta_ <- 0.25` is silently undone by
    # the next set_drivers() -- the same shape of bug as #96. These three are inputs
    # and survive re-driving, which is what makes the soil-beta option usable in a
    # sweep. Volumetric water content, m^3 m^-3.
    theta: {type: double, access: field}
    theta_fc: {type: double, access: field}
    theta_w: {type: double, access: field}
    # --- Sperry (2017) ProfitMax, all unitless -------------------------------
    # Written ONLY by the ProfitMax path. `hydraulic_cost_` is deliberately NOT
    # reused: it holds carbon units on the TF24 path and conductance units on the
    # Sperry-cost one, and a third meaning behind the same name is how a reader
    # quotes the wrong number.
    carbon_gain_: {type: double, access: field}
    hydraulic_cost_norm_: {type: double, access: field}
    thermal_cost_: {type: double, access: field}
    hydraulic_cost_: {type: double, access: field}
    opt_psi_stem_: {type: double, access: field}
    opt_root_psi_: {type: double, access: field}
    opt_ci_: {type: double, access: field}
    E_up_: {type: double, access: field}
    assim_max_: {type: double, access: field}
    count: {type: double, access: field}
    # The leaf's OWN temperature at the operating point, deg C. Bound here rather
    # than in the energy-balance block below, because that block is the PM path's
    # configuration and this is an output on both paths -- off the PM path it is a
    # copy of the `leaf_temp_` driver, on it `leaf_temp_` is air temperature and
    # this is the only place the leaf's temperature appears at all.
    Tleaf_: {type: double, access: field}

    # --- temperature-dependent photosynthetic parameters ---------------------
    electron_transport_: {type: double, access: field}
    gamma_: {type: double, access: field}
    ko_: {type: double, access: field}
    kc_: {type: double, access: field}
    km_: {type: double, access: field}
    R_d_: {type: double, access: field}
    vcmax_: {type: double, access: field}
    jmax_: {type: double, access: field}

    # --- the temperature RESPONSE itself, which was C++-only until now -------
    #
    # The eight fields above are DERIVED: set_physiology recomputes them from
    # leaf temperature on every call, so writing one from R is overwritten by
    # the next solve. These fifteen are the parameters that generate them.
    #
    # ⚠️ That is not a small gap. The defaults imply a thermal optimum near
    # 31.2 C for Vcmax and 27.9 C for Jmax (Topt = H_d / (d_S - R*log(ha/(H_d -
    # ha)))), and any study calibrating a temperature response -- which is most
    # of the reason to reach for this model -- needs to move them. Jones et al.
    # (2026) fit 35 C for both.
    #
    # The temperature cache is keyed on every scalar
    # `update_temperature_dependent_params()` reads, so setting any of these and
    # re-supplying the drivers recomputes, as a caller would expect (#41).
    # `test_temperature_params_invalidate_cache` asserts it through the route a
    # caller actually takes.
    #
    # ⚠️ `set_traits()` is STILL the right way to change a TRAIT (`vcmax_25`,
    # `jmax_25`, ...): the vulnerability splines and the solved operating point need
    # clearing too, and the cache key does not do that.
    vcmax_ha_: {type: double, access: field}
    vcmax_H_d_: {type: double, access: field}
    vcmax_d_S_: {type: double, access: field}
    jmax_ha_: {type: double, access: field}
    jmax_H_d_: {type: double, access: field}
    jmax_d_S_: {type: double, access: field}
    gamma_25_: {type: double, access: field}
    gamma_ha_: {type: double, access: field}
    kc_25_: {type: double, access: field}
    kc_ha_: {type: double, access: field}
    ko_25_: {type: double, access: field}
    ko_ha_: {type: double, access: field}
    # Dark respiration at 25 C. Bound as a field as well as being a `set_traits()`
    # argument, because plant's own bindings pin the generated constructor by arity
    # so `leaf_model()` has to apply it afterwards.
    R_d_25: {type: double, access: field}
    # Joshi & Stocker (2022)'s hydraulic unit cost. A field for the same reason
    # R_d_25 is one: the constructor is pinned by arity, so leaf_model() assigns it
    # after construction. ⚠️ The default is NOT a literature value -- see the member.
    JS22_gamma: {type: double, access: field}
    # Wolf/Anderegg CMax. Fields for the same reason. ⚠️ CMax_b is SIGNED.
    CMax_a: {type: double, access: field}
    CMax_b: {type: double, access: field}
    # The Tjoelker (2001) declining-Q10 coefficients:
    #   Q10(T) = rd_q10_intercept_ - rd_q10_slope_ * (T + 25) / 2
    # Set the slope to zero and the intercept IS a constant Q10.
    rd_q10_intercept_: {type: double, access: field}
    rd_q10_slope_: {type: double, access: field}

    # --- drivers, as last set by set_physiology ------------------------------
    PPFD_: {type: double, access: field}
    atm_vpd_: {type: double, access: field}
    ca_: {type: double, access: field}
    leaf_temp_: {type: double, access: field}
    atm_o2_kpa_: {type: double, access: field}
    atm_kpa_: {type: double, access: field}
    leaf_specific_conductance_max_: {type: double, access: field}

    # --- soil geometry and state, which live in roots_ (hazard 7) ------------
    soil_depth_: {type: "std::vector<double>", access: field, name_cpp: "roots_.soil_depth_"}
    z_soil_mid_: {type: "std::vector<double>", access: field, name_cpp: "roots_.z_soil_mid_"}
    dz_: {type: double, access: field, name_cpp: "roots_.dz_"}
    soil_number_of_depths_: {type: int, access: field, name_cpp: "roots_.soil_number_of_depths_"}
    max_soil_layer: {type: int, access: field, name_cpp: "roots_.max_soil_layer"}
    psi_soil_: {type: "std::vector<double>", access: field, name_cpp: "roots_.psi_soil_"}

    # --- the root resistance network -----------------------------------------
    c_r_V_: {type: "std::vector<double>", access: field, name_cpp: "roots_.network_.c_r_V"}
    c_r_H_: {type: "std::vector<double>", access: field, name_cpp: "roots_.network_.c_r_H"}
    r_R_H_min: {type: "std::vector<double>", access: field, name_cpp: "roots_.network_.r_R_H_min"}
    r_R_V: {type: "std::vector<double>", access: field, name_cpp: "roots_.network_.r_R_V"}
    r_R_V_sum: {type: "std::vector<double>", access: field, name_cpp: "roots_.network_.r_R_V_sum"}
    f_r: {type: "std::vector<double>", access: field}

    # --- the closed-form method's instrumentation -----------------------------
    # Whether the LAST optimise() fell back from the closed form to the exact
    # solve. Written by every optimise(), including the exact one, so it can never
    # report a previous solve's answer (hazard 8).
    last_solve_fell_back_: {type: bool, access: field}
    closed_form_calls_: {type: int, access: field}
    closed_form_fallbacks_: {type: int, access: field}

    # --- energy balance (#523) ------------------------------------------------
    use_energy_balance_: {type: bool, access: field}
    # The deficit Fick's law divides by (PLAN 13.1). READ-ONLY in practice: it is
    # derived by set_leaf_vpd from `atm_vpd` and the leaf temperature, and every
    # solve overwrites it. Bound because a caller checking why gs moved needs to
    # see it, and because `vpd_leaf_ == atm_vpd_` is the statement that the
    # prescribed-temperature path is unchanged.
    vpd_leaf_: {type: double, access: field}
    # --- Sicangco et al. (2026) instantaneous thermal cost, default OFF -------
    # ⚠️ NOT plant's ATLS thermal damage, which is a LASTING ratchet. This is a
    # cost paid at the temperature the leaf is at now, with no memory.
    use_thermal_cost_: {type: bool, access: field}
    T50_: {type: double, access: field}
    Tcrit_: {type: double, access: field}
    # Points used to scan the supply stream for |A|max. Sicangco use 500-600.
    # Cells the single-layer optimisers scan before refining, so a maximum at
    # full closure or past a second hump is reachable. 64 matches a 2001-point
    # reference over a 1728-row driver sweep; lower it only with a measurement.
    boundary_scan_n_: {type: int, access: field}
    d_: {type: double, access: field}
    wind_speed_: {type: double, access: field}
    Tair_: {type: double, access: field}
    Rn_: {type: double, access: field}
    ra_: {type: double, access: field}

    # --- Medlyn stomatal-conductance model (plant develop #450) --------------
    medlyn_model_gs_: {type: double, access: field}
    g0: {type: double, access: field}
    g1: {type: double, access: field}
    theta_w_: {type: double, access: field}
    theta_fc_: {type: double, access: field}
    theta_: {type: double, access: field}

    # --- lambda and g1_eff (issue #5; PLAN item 8) ---------------------------
    #
    # New here: these exist in C++ and were unreachable from R, which is the
    # first thing the companion project's list asks for. They are ACCESSORS, not
    # stored state (hazard 5: find_root_collar_psi runs ~10^3 inner evaluations
    # per solve, so nothing that is only ever read afterwards gets a member), so
    # they are `access: member` and read-only -- RcppR6 makes an active read-only
    # exactly when no `name_cpp_set` is given.
    #
    # They read the solved state, so they are meaningful only after
    # find_root_collar_psi(). Reading one before that gets whatever the
    # NA-sentinel arithmetic produces, in keeping with every other output here.
    # --- which soil -> root-collar supply path is in force (issue #32) -------
    #
    # READ-ONLY, all three, and that is the design rather than caution. The
    # footgun PLAN 7b-iii flagged is that assigning the tag leaves the other
    # path's state configured and silently ignored, so there is no settable
    # `supply_kind` here at all -- the only way to change it is
    # set_supply_multilayer() / set_supply_single(), which leave the tag and the
    # supply agreeing. `gravity_head` is read-only for a weaker reason: setting it
    # while the multi-layer path is active would do nothing, which is a confusing
    # thing to allow. `single_resistance_` is read-only for the STRONGER reason --
    # it is a per-call driver now, so a write here would be overwritten by the next
    # set_physiology and is exactly the stale-state trap hazard 8 describes.
    supply_kind: {type: "std::string", access: member, name_cpp: supply_kind_name}
    single_resistance_: {type: double, access: field, name_cpp: "single_.resistance_", readonly: true}
    single_gravity_head_: {type: double, access: field, name_cpp: "single_.grav_head_", readonly: true}
    single_psi_soil_: {type: double, access: field, name_cpp: "single_.psi_soil_", readonly: true}

    lambda: {type: double, access: member, name_cpp: marginal_cost_water}
    lambda_molar: {type: double, access: member, name_cpp: marginal_cost_water_molar}
    lambda_multilayer: {type: double, access: member, name_cpp: marginal_cost_water_multilayer}
    # THE MARGINAL COST OF WATER THE OPERATING POINT IMPLIES, `(dC/dpsi)/(dE/dpsi)`
    # in umol C (kg H2O)^-1 -- the one output every cost curve reports on the same
    # axis, and in the same units as the `$CF77_lambda_` INPUT so the two are directly
    # comparable. Cowan-Farquhar prices water at a constant, so its emergent lambda
    # IS that constant; every other curve's moves with the drivers.
    #
    # Read-only: a settable one would be a way to disagree with the operating point
    # it comes from. NA until an optimiser has run.
    lambda_emergent: {type: double, access: member, name_cpp: lambda_emergent}
    # ProfitMax's normalisers, so its equivalence ratio |A|max/k_span is one
    # division away. ⚠️ That ratio is NOT a lambda -- it is carbon per unit
    # CONDUCTANCE lost, because it multiplies `k(psi_soil) - k(psi)`.
    profitmax_A_max: {type: double, access: member, name_cpp: profitmax_A_max}
    profitmax_k_span: {type: double, access: member, name_cpp: profitmax_k_span}
    g1_eff: {type: double, access: member, name_cpp: g1_eff}
    # Conductance to WATER, mol H2O m^-2 s^-1 (#56). Every data source and the g1
    # literature record gs to water; the model solves for gs to CO2. An accessor, not
    # stored state (hazard 5).
    gs_H2O: {type: double, access: member, name_cpp: stom_cond_H2O}

    # The H2O:CO2 stomatal diffusion ratio (#50). 1.67 here; Medlyn et al. (2011) and
    # the g1 literature use 1.6, and `g1_eff` exists to be compared against those.
    #
    # ⚠️ Settable, and it REACHES THE SOLVE rather than only a reported output, so a
    # solved leaf must be re-solved after changing it.
    H2O_CO2_stom_diff_ratio_: {type: double, access: field}

  methods:
    # All thirteen reported outputs in ONE call, for the R boundary's benefit.
    #
    # A method rather than an `active` entry because it does a little work (the
    # uptake sum), and it is bound at all because reading the thirteen outputs
    # through their individual active bindings costs ~15 us -- five times the ~3
    # us solve that produced them (#39). R's operating_point() and leaf_solve()
    # both read it, and test-surface.R asserts it agrees element-for-element
    # with the thirteen separate bindings, which is what keeps the ORDER honest:
    # the position of each value here is the interface.
    operating_point_values:
      return_type: "std::vector<double>"
    initialize_integrator:
      return_type: void
      args: [integration_rule: int, integration_tol: double]
    set_physiology:
      return_type: void
      args: [root_network: "const phylloptim::RootNetwork&", PPFD: double, psi_soil: "const std::vector<double>&", soil_depth: "const std::vector<double>&", leaf_specific_conductance_max: double, atm_vpd: double, ca: double, leaf_temp: double, atm_o2_kpa: double, atm_kpa: double]

    # Replace the traits on an existing Leaf. Fifteen arguments in the
    # constructor's own order, minus the four numerical controls.
    #
    # A METHOD, NOT FIFTEEN SETTABLE FIELDS. The traits are public doubles, so
    # `access: field` entries would have worked and would have been wrong: a bare
    # field write bypasses the #25 invariant checks, leaves the two pre-integrated
    # vulnerability splines describing the previous curve, and leaves the solved
    # operating point describing the old traits (hazard 8).
    #
    # This used to carry a third reason -- that vcmax_/jmax_/R_d_ would go stale
    # behind a temperature cache keyed on (leaf_temp, atm_o2_kpa) alone, so that
    # re-supplying the drivers took a cache HIT and never recomputed. **#55 closed
    # that**: the key is every scalar `update_temperature_dependent_params()`
    # reads, `vcmax_25` and `jmax_25` among them, exactly as the temperature-response
    # block above already says. The two reasons that remain are enough, and this
    # comment contradicting that one for two releases is why the claim is stated in
    # one place now.
    #
    # The leaf_model.hpp declaration has the full reasoning; it is the same
    # judgement as supply_kind above, reached from a different direction.
    #
    # This exists so a calibration loop can perturb a trait without rebuilding the
    # R object: measured, constructing a Leaf from R costs ~204 us against ~4 us to
    # re-trait and re-drive an existing one, and that ratio -- not the choice of
    # gradient formula -- is what dominates a finite-difference gradient in R.
    # Move stem_b without rebuilding the stem vulnerability spline, for a gradient
    # in it (PLAN 11f). The curve is homogeneous of degree 1 in stem_b, so the
    # spline for another stem_b is this one with its argument rescaled -- measured
    # to reproduce a rebuilt spline to 0-3e-16. There is no such identity for
    # stem_c, which is why only one parameter is here.
    #
    # ⚠️ Leaves the splines built at a different stem_b on purpose, and does not
    # clear the solved outputs; set_traits() is the way back. Bound because
    # leaf_gradient() is in R -- not because a user should reach for it, which is
    # why its documentation is on leaf_gradient() rather than here.
    perturb_stem_P50:
      return_type: void
      args: [stem_P50: double]
    set_traits:
      return_type: void
      args: [vcmax_25: double, stem_c: double, stem_P50: double, root_c: double, root_P50: double, TF24_beta2: double, jmax_25: double, a: double, curv_fact_elec_trans: double, curv_fact_colim: double, TF24_cost_scale: double, R_d_25: double, JS22_gamma: double, CMax_a: double, CMax_b: double]

    # --- transpiration and conductance ---------------------------------------
    proportion_of_conductivity:
      return_type: double
      args: [psi: double]
    arrh_curve:
      return_type: double
      args: [Ea: double, ref_value: double, leaf_temp: double]
    peak_arrh_curve:
      return_type: double
      args: [Ea: double, ref_value: double, leaf_temp: double, H_d: double, d_S: double]
    transpiration:
      return_type: double
      args: [psi_stem: double, psi_upstream: double]
    transpiration_full_integration:
      return_type: double
      args: [psi_stem: double, psi_upstream: double]
    stom_cond_CO2:
      return_type: double
      args: [psi_stem: double, psi_upstream: double]
    transpiration_to_psi_stem:
      return_type: double
      args: [transpiration_: double, psi_upstream: double]

    # --- assimilation ---------------------------------------------------------
    assim_rubisco_limited:
      return_type: double
      args: [ci_: double]
    assim_electron_limited:
      return_type: double
      args: [ci_: double]
    assim_colimited:
      return_type: double
      args: [ci_: double]
    assim_minus_stom_cond_CO2:
      return_type: double
      args: [x: double, psi_stem: double, psi_upstream: double]
    electron_transport:
      return_type: double
      args: []
    # The operating-point leaf temperature at a given transpiration, on the
    # energy-balance path. Bound so a caller aligning an EXTERNAL energy balance to
    # this one can iterate on the model's own function rather than transcribing
    # `Tair + (Rn - lambda*E)*ra/rho_cp` into R -- where it would go stale the
    # first time this one changed, silently.
    leaf_temp_from_E:
      return_type: double
      args: [E: double]
    set_leaf_states_rates_from_psi_stem:
      return_type: void
      args: [psi_stem: double, psi_upstream: double]

    # --- the soil -> root-collar supply path ----------------------------------
    #
    # These four take the soil state as an ARGUMENT, and #25 changed what that
    # argument means -- positive suction magnitudes, not signed potentials --
    # without changing any signature. Each validates the vector and stops on a
    # negative entry. That check is the only thing standing between a pre-#25
    # script and a plausible wrong number, so a friendlier wrapper in stage 2
    # must keep it rather than smooth it over.
    E_from_Soil_to_Root_Collar:
      return_type: void
      args: [P_x_r: double, psi_soil: "std::vector<double>"]
    find_root_collar_psi:
      return_type: void
      args: []
    find_root_psi:
      return_type: double
      args: [wettest_soil_layer: double, psi_soil: "std::vector<double>", find_root_crit: int]
    find_psi_stem_from_psi_root:
      return_type: double
      args: [psi_root: double, psi_soil: "std::vector<double>"]
    evaluate_root_collar_psi:
      return_type: double
      args: [target_opt_root_psi: double]
    dprofit_droot_collar_psi:
      return_type: double
      args: [opt_root_psi: double]
    dprofit_droot_collar_psi_checked:
      return_type: "std::vector<double>"
      args: [opt_root_psi: double]
    psi_stem_to_ci:
      return_type: double
      args: [psi_stem: double, psi_upstream: double]

    # --- leaf economics -------------------------------------------------------
    hydraulic_cost_TF:
      return_type: double
      args: [psi_stem: double]
    # Cowan & Farquhar (1977): `lambda * E`, a carbon flux, because `$CF77_lambda_` is
    # umol C per kg of water. This is the cost curve `$CF77_lambda_`'s units belong to,
    # and the one whose first-order condition is the dA/dE == lambda that the
    # optimality literature is written in.
    hydraulic_cost_CF77:
      return_type: double
      args: [psi_stem: double, psi_upstream: double]
    hydraulic_cost_JS22:
      return_type: double
      args: [psi_stem: double, psi_upstream: double]
    hydraulic_cost_CMax:
      return_type: double
      args: [psi_stem: double, psi_upstream: double]
    profit_psi_stem_TF:
      return_type: double
      args: [psi_stem: double, psi_upstream: double]
    profit_psi_stem_CF77:
      return_type: double
      args: [psi_stem: double, psi_upstream: double]
    profit_psi_stem_JS22:
      return_type: double
      args: [psi_stem: double, psi_upstream: double]
    profit_psi_stem_CMax:
      return_type: double
      args: [psi_stem: double, psi_upstream: double]
    lambda_JS22:
      return_type: double
      args: [psi_stem: double, psi_upstream: double]
    lambda_CMax:
      return_type: double
      args: [psi_stem: double, psi_upstream: double]
    # --- the product-objective family (PLAN 7c) ------------------------------
    # ⚠️ profit_psi_stem_SOX returns a PRODUCT, not a carbon profit.
    sox_reduction:
      return_type: double
      args: [psi_stem: double]
    profit_psi_stem_SOX:
      return_type: double
      args: [psi_stem: double, psi_upstream: double]
    lambda_SOX:
      return_type: double
      args: [psi_stem: double, psi_upstream: double]
    jw26_reduction:
      return_type: double
      args: [psi_stem: double]
    profit_psi_stem_JW26:
      return_type: double
      args: [psi_stem: double, psi_upstream: double]
    lambda_JW26:
      return_type: double
      args: [psi_stem: double, psi_upstream: double]
    lambda_TF24:
      return_type: double
      args: [psi_stem: double]

    # --- optimisers -----------------------------------------------------------

    # Cowan & Farquhar (1977), the model the whole optimality family is measured
    # against: maximise `A - lambda*E`, so the optimum satisfies dA/dE == lambda.
    #
    # ⚠️ `$CF77_lambda_` IS A REQUIRED INPUT and has no default -- it is the marginal
    # value of water in umol C (kg H2O)^-1, and this refuses rather than optimise
    # a NaN objective. Its SCALE is set by the leaf, not chosen freely: at the
    # package defaults the leaf's own marginal cost of water runs 9e4 to 3e5, and
    # a lambda far outside that band pins the optimum shut or wide open.
    # `$lambda` (that is, `marginal_cost_water()`) reports the same quantity for
    # the other cost curves, so it is how you find a value that means something.
    # --- runtime curve selection, for the gradient ----------------------------
    # ⚠️ `curve` is the CostCurve enum's VALUE. R sends positions into it, so
    # appending is safe and reordering would silently solve a different model;
    # `curve_name()` is bound so R can compare the mapping rather than trust it.
    # Refresh the analytic normalisers and PIN |A|max, which is what a
    # perturbation needs: the scan-derived normaliser is held at the base point so
    # the gradient is the partial this package reports.
    prepare_profitmax_at:
      return_type: void
      args: [A_max: double]
    set_model:
      roxygen: |
        Choose the optimality model this leaf solves.

        The model is configuration rather than a call argument, because its
        PARAMETERS already are: `CF77_lambda_` is a field, and `JS22_gamma`,
        `CMax_a` and `CMax_b` are traits. Seat the model, set whatever constants it
        needs, then call `optimise()`.

        `route = "collar"` is the production formulation -- the full
        soil-to-collar-to-stem path, with a root network or with a single soil
        potential carrying a series resistance. `route = "stem"` optimises
        `psi_stem` with the upstream potential pinned at `psi_soil`, the form the
        published models are written in, and needs a single soil potential.

        `method` is the third axis, and it selects HOW the operating point is
        reached rather than WHAT is being optimised. `"exact"` root-finds the
        first-order condition over the closed interval and is the default and the
        production path. `"closed"` uses the closed form: given the marginal cost
        of water, the optimum collapses to the Medlyn USO relation
        `ci/ca = xi/(xi + sqrt(D))`, and where `lambda` is a power law in `psi` at
        the wet end that inverts explicitly.

        ⚠️ **`"closed"` is an approximation with a guard and a fallback, and it is
        refused rather than approximated where it does not apply.** It exists for
        `TF24` and `CF77` only; `SOX` and `JW26` cannot have one at all (their
        benefit link makes `lambda` carry the assimilation the solve is for); it
        needs the stem route and a single soil layer; and it is refused with
        `use_energy_balance_` on, because the deficit then depends on the
        transpiration being solved for. Where its validity guard fails it falls
        back to the exact solve — see `$closed_form_fallback_fraction()`.

        Defaults to `"TF24"`, `"collar"` and `"exact"`, so a caller that never sets
        a model gets the production path.
        @param curve cost curve name, from \code{\link{cost_curve_names}}
        @param route `"collar"` or `"stem"`
        @param method `"exact"` (default) or `"closed"`
        @export
      return_type: void
      args: [curve: "std::string", route: "std::string", method: 'std::string = "exact"']
    model_curve:
      return_type: "std::string"
    model_route:
      return_type: "std::string"
    model_method:
      return_type: "std::string"
    closed_form_fallback_fraction:
      roxygen: |
        Fraction of closed-form solves that fell back to the exact solve.

        The closed form's validity guard tests an OUTPUT (`ci/ca > 0.5`, plus
        being strictly inside the feasible bracket), so it can only be applied
        after solving and the fallback cannot be predicted from the drivers. That
        makes the realised speedup `1 / [phi + (1 - phi)/S]` rather than `S`, and
        this is `phi`.

        `NA` before any closed-form solve, so "never asked" is distinguishable
        from "never fell back". Counts accumulate across `optimise()` calls;
        `$reset_closed_form_counters()` clears them. `$last_solve_fell_back_`
        answers the same question for the most recent solve alone.
        @export
      return_type: double
    reset_closed_form_counters:
      roxygen: |
        Zero the closed-form call and fallback counters.
        @export
      return_type: void
    optimise:
      roxygen: |
        Solve for the operating point under the model this leaf is set to.

        Takes no arguments: the curve, the route, the supply path and the curve's
        own constants are all already on the object. See `set_model()`.
        @export
      return_type: void
    # The stem route's two off-solve entry points. Neither names a curve: they
    # read the one `set_model()` seated, exactly as `optimise()` does, so a
    # caller never handles an index that means a different model when the
    # enumeration grows. Both refuse on the collar route.
    evaluate_psi_stem_at:
      roxygen: |
        Evaluate the leaf at a prescribed psi_stem, rather than optimising one.

        Uses the model `set_model()` seated, so seat a STEM route first. Leaves
        the same outputs a solve would and returns `profit_`.
        @param target_psi_stem stem water potential to evaluate at, MPa as a
          positive magnitude. Clamped into `[psi_soil, psi_crit]`; compare the
          resulting `$opt_psi_stem_` with what you asked for to detect it.
        @export
      return_type: double
      args: [target_psi_stem: double]
    dprofit_dpsi_stem_checked:
      roxygen: |
        dprofit/dpsi_stem at a given stem potential, with its feasibility.

        Uses the model `set_model()` seated, so seat a STEM route first.

        ⚠️ **Returns `c(dprofit, feasible)`, and the second entry is not
        optional.** The derivative is a hard `0.0` SENTINEL on the shut-down and
        reversed-gradient exits, which is indistinguishable from a stationary
        point; a composite that reads the value without the flag reports the
        shut-down state as the optimum.
        @param psi_stem stem water potential, MPa as a positive magnitude
        @export
      return_type: "std::vector<double>"
      args: [psi_stem: double]

    # --- Sperry (2017) ProfitMax with BOTH terms normalised -------------------
    #
    # Maximises `CG - (HC + TC)` with CG and HC normalised as Sperry defines them.
    # Multiplying that objective by |A|max gives the constant-lambda form
    # `A - lambda*(k_soil - k(psi))` with lambda = |A|max/(k_soil - kcrit), so the
    # two share an argmax -- and `$lambda` reports that value, so the relation is
    # inspectable. There is deliberately no prescribed-lambda entry point: |A|max
    # is a property of the drivers, so the equivalent lambda is not a constant, and
    # fixing one contradicts the model rather than configuring it.
    #
    # Single soil layer only, like the other two -- which is not a restriction for
    # this model, whose supply is the integral of one vulnerability curve with no
    # root network in it.
    thermal_cost_at:
      return_type: double
      args: [leaf_temp: double]
    prepare_profitmax:
      return_type: void
      args: []
    profit_psi_stem_ProfitMax:
      return_type: double
      args: [psi_stem: double, psi_upstream: double]
    # n rows of (psi, CG, HC, TC, profit), flattened COLUMN-MAJOR, in one crossing
    # of the R boundary. This is Sicangco et al.'s Figures 2, 3 and S4; building it
    # row by row from R would pay ~1.8 us of call overhead against a ~3 us model.
    profitmax_curve:
      return_type: "std::vector<double>"
      args: [n: int]

    # --- Medlyn stomatal-conductance model (plant develop #450) --------------
    medlyn_model_gs:
      return_type: double
      args: [assim_colimited_: double]
    solve_medlyn_ci_numerical:
      return_type: void
      args: []
    solve_medlyn_ci_analytical:
      return_type: void
      args: []

    # --- setup ---------------------------------------------------------------
    # Exposed because the default constructor builds both vulnerability splines
    # at 100 control points and a caller who changes vulnerability_curve_ncontrol
    # through the constructor gets them rebuilt there -- but a caller reaching in
    # to change stem_b/root_b afterwards does not, and would otherwise be stuck
    # with splines for the old curve. See the note in setup_transpiration.
    # --- choosing the supply path (issue #32) --------------------------------
    #
    # Two entry points rather than a settable tag. Each leaves the object in a
    # state where the tag and the supply state agree; there is no intermediate
    # state in which they disagree, which is what a bindable `supply_kind_`
    # would have created. Both clear the solved state, so set_physiology() has
    # to be called again -- the two paths read different inputs, so anything
    # carried across would be answering a question about the other model.
    set_supply_multilayer:
      return_type: void
      args: []
    set_supply_single:
      return_type: void
      args: [gravity_head: double]

    setup_transpiration:
      return_type: void
      args: [resolution: double]
    setup_root_vulnerability:
      return_type: void
      args: [resolution: double]
